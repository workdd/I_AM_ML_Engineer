l="#dc2626" text-anchor="start" font-weight="bold">라벨 1.0 이어도 0.6875 → 제안까지</text><text x="530" y="274" font-size="10.5" fill="#59636e" text-anchor="start" font-weight="normal">점 = 매칭 기준에 닿는 최소 라벨 유사도</text><text x="530" y="291" font-size="10.5" fill="#59636e" text-anchor="start" font-weight="normal">가중치: 라벨 0.55 · 이웃 0.25</text><text x="530" y="308" font-size="10.5" fill="#59636e" text-anchor="start" font-weight="normal">  · 타입 0.1 · 속성 0.1</text><text x="530" y="325" font-size="10.5" fill="#59636e" text-anchor="start" font-weight="normal">경쟁 후보보다 0.05 이상 앞서야 수락</text><text x="20" y="450" font-size="11" fill="#59636e" text-anchor="start" font-weight="normal">이웃 신호는 이미 짝지어진 이웃이 있을 때만 생긴다. 첫 라운드에서 라벨만으로 짝을 찾고, 그 짝이 다음 라운드의 이웃 증거가 된다(최대 5라운드)</text><text x="20" y="468" font-size="11" fill="#59636e" text-anchor="start" font-weight="normal">타입·속성이 같으면 곡선이 위로, 다르면 아래로 움직인다. 이 그림은 둘 다 비어 있는 LLM 추출 그래프에 가까운 경우다</text><text x="752" y="484" font-size="9" fill="#8b949e" text-anchor="end">생성: python scripts/figures/kgdiff_figures.py · 손으로 고치지 말 것</text></svg>