11" fill="#59636e" text-anchor="start" font-weight="normal">선형 모형: 토큰 = 270 + 165 × 행 수. 원문 "20행 묶음이면 행당 약 175" 와 178.5 로 맞는다</text><text x="20" y="378" font-size="11" fill="#59636e" text-anchor="start" font-weight="normal">정확도가 떨어지는 이유를 원문은 모델이 배열 안 rows[i] 를 위치로 찾기 때문이라고 설명한다</text><text x="752" y="394" font-size="9" fill="#8b949e" text-anchor="end">생성: python scripts/figures/pgjev_figures.py · 손으로 고치지 말 것</text></svg>