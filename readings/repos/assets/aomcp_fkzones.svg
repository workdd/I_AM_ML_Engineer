<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" role="img" aria-label="auto-ontology-mcp FK 후보 판정 영역" style="max-width:100%;height:auto;font-family:-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><title>auto-ontology-mcp FK 후보 판정 영역</title><rect width="800" height="520" fill="#ffffff"/><text x="20" y="28" font-size="15" fill="#1f2328" text-anchor="start" font-weight="bold">미선언 FK 후보 판정: 값 containment 와 이름 점수로 버림 · 검토 제안 · 자동 수락을 가른다</text><text x="20" y="46" font-size="11" fill="#59636e" text-anchor="start" font-weight="normal">inference.py 상수 그대로. containment &lt; 0.6 은 버리고, 0.98 이상이면서 이름 점수 0.75 이상만 자동 수락</text><rect x="90" y="80" width="282.0" height="360" fill="#8b949e" opacity="0.25"/><rect x="372.0" y="80" width="188.0" height="360" fill="#ca8a04" opacity="0.22"/><rect x="550.5999999999999" y="80" width="9.400000000000091" height="90.0" fill="#16a34a" opacity="0.85"/><line x1="372.0" y1="152.0" x2="560.0" y2="296.0" stroke="#59636e" stroke-dasharray="4 3" stroke-width="1"/><text x="376.0" y="166.0" font-size="10" fill="#59636e" text-anchor="start" font-weight="normal">confidence 0.7</text><line x1="372.0" y1="80.0" x2="560.0" y2="224.0" stroke="#59636e" stroke-dasharray="4 3" stroke-width="1"/><text x="376.00000000000006" y="94.0" font-size="10" fill="#59636e" text-anchor="start" font-weight="normal">confidence 0.8</text><rect x="90" y="80" width="470" height="360" fill="none" stroke="#1f2328" stroke-width="1"/><text x="90" y="456" font-size="10" fill="#59636e" text-anchor="middle" font-weight="normal">0</text><text x="82" y="444" font-size="10" fill="#59636e" text-anchor="end" font-weight="normal">0</text><text x="184.0" y="456" font-size="10" fill="#59636e" text-anchor="middle" font-weight="normal">0.2</text><text x="82" y="372.0" font-size="10" fill="#59636e" text-anchor="end" font-weight="normal">0.2</text><text x="278.0" y="456" font-size="10" fill="#59636e" text-anchor="middle" font-weight="normal">0.4</text><text x="82" y="300.0" font-size="10" fill="#59636e" text-anchor="end" font-weight="normal">0.4</text><text x="372.0" y="456" font-size="10" fill="#59636e" text-anchor="middle" font-weight="normal">0.6</text><text x="82" y="228.0" font-size="10" fill="#59636e" text-anchor="end" font-weight="normal">0.6</text><text x="466.0" y="456" font-size="10" fill="#59636e" text-anchor="middle" font-weight="normal">0.8</text><text x="82" y="156.0" font-size="10" fill="#59636e" text-anchor="end" font-weight="normal">0.8</text><text x="560.0" y="456" font-size="10" fill="#59636e" text-anchor="middle" font-weight="normal">1</text><text x="82" y="84.0" font-size="10" fill="#59636e" text-anchor="end" font-weight="normal">1</text><text x="325.0" y="474" font-size="11" fill="#1f2328" text-anchor="middle" font-weight="normal">containment (소스 distinct 값 중 대상 키에 있는 비율, 최대 500개 샘플)</text><text x="44" y="260.0" font-size="11" fill="#1f2328" text-anchor="middle" transform="rotate(-90 44 260.0)">이름 점수 (name_score)</text><text x="231.0" y="260.0" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="bold">버림</text><text x="461.29999999999995" y="300.0" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="bold">검토 제안 (proposed)</text><text x="544.5999999999999" y="172.0" font-size="11" fill="#14532d" text-anchor="end" font-weight="bold">자동 수락 ↗</text><text x="590" y="90" font-size="12" fill="#1f2328" text-anchor="start" font-weight="bold">판정 규칙</text><text x="590" y="110" font-size="11" fill="#59636e" text-anchor="start" font-weight="normal">containment &lt; 0.6: 후보 삭제</text><text x="590" y="130" font-size="11" fill="#59636e" text-anchor="start" font-weight="normal">c ≥ 0.98 이고 이름 ≥ 0.75: accepted</text><text x="590" y="150" font-size="11" fill="#59636e" text-anchor="start" font-weight="normal">그 밖: proposed (모델이 검토)</text><text x="590" y="170" font-size="11" fill="#59636e" text-anchor="start" font-weight="normal"></text><text x="590" y="190" font-size="12" fill="#1f2328" text-anchor="start" font-weight="bold">confidence</text><text x="590" y="210" font-size="11" fill="#59636e" text-anchor="start" font-weight="normal">= 0.5 × 이름 점수 + 0.5 × c</text><text x="590" y="230" font-size="11" fill="#59636e" text-anchor="start" font-weight="normal">probe 실패: 이름 점수 × 0.5</text><text x="590" y="250" font-size="11" fill="#59636e" text-anchor="start" font-weight="normal"></text><text x="590" y="270" font-size="12" fill="#1f2328" text-anchor="start" font-weight="bold">README 데모 (미선언 FK 9개)</text><text x="590" y="290" font-size="11" fill="#59636e" text-anchor="start" font-weight="normal">자동 수락 7 · 검토 1 · 연결 못 함 1</text><text x="20" y="496" font-size="11" fill="#59636e" text-anchor="start" font-weight="normal">자동 수락 영역은 전체의 한 귀퉁이다. 값이 거의 다 맞고 이름도 맞아야 하므로, 우연히 겹치는 정수 키는 대부분 검토 제안으로 떨어진다</text><text x="792" y="514" font-size="9" fill="#8b949e" text-anchor="end">생성: python scripts/figures/aomcp_figures.py · 손으로 고치지 말 것</text></svg>