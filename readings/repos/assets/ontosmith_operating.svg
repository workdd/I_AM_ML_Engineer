<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" width="800" height="330" role="img" aria-label="OntoSmith 운영점 비교" style="max-width:100%;height:auto;font-family:-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><title>OntoSmith 운영점 비교</title><rect width="800" height="330" fill="#ffffff"/><text x="20" y="28" font-size="15" fill="#1f2328" text-anchor="start" font-weight="bold">운영점 두 개: 출하 기본은 판정 쌍과 비용이 1.95배이고 recall 은 서로 다른 계약의 값이다</text><text x="20" y="46" font-size="12" fill="#59636e" text-anchor="start" font-weight="normal">Re-DocRED dev 500문서 · 판정 비용은 쌍당 $0.0006683 실현 단가 기준</text><text x="150.0" y="74" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="bold">후보 쌍 수</text><line x1="30" y1="250" x2="270" y2="250" stroke="#d8dee4"/><rect x="60" y="187.1" width="70" height="62.9" rx="2" fill="#2563eb" opacity="0.9"/><text x="95" y="181.14466666666667" font-size="11" fill="#1f2328" text-anchor="middle" font-weight="bold">26,938</text><text x="95" y="266" font-size="10" fill="#59636e" text-anchor="middle" font-weight="normal">측정 빌드</text><rect x="160" y="127.6" width="70" height="122.4" rx="2" fill="#ea580c" opacity="0.9"/><text x="195" y="121.58633333333333" font-size="11" fill="#1f2328" text-anchor="middle" font-weight="bold">52,463</text><text x="195" y="266" font-size="10" fill="#59636e" text-anchor="middle" font-weight="normal">출하 기본</text><text x="410.0" y="74" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="bold">판정 비용 (USD)</text><line x1="290" y1="250" x2="530" y2="250" stroke="#d8dee4"/><rect x="320" y="187.0" width="70" height="63.0" rx="2" fill="#2563eb" opacity="0.9"/><text x="355" y="180.98985" font-size="11" fill="#1f2328" text-anchor="middle" font-weight="bold">$18.00</text><text x="355" y="266" font-size="10" fill="#59636e" text-anchor="middle" font-weight="normal">측정 빌드</text><rect x="420" y="127.3" width="70" height="122.7" rx="2" fill="#ea580c" opacity="0.45" stroke="#ea580c" stroke-dasharray="4 3"/><text x="455" y="121.28999999999999" font-size="11" fill="#1f2328" text-anchor="middle" font-weight="bold">$35.06</text><text x="455" y="266" font-size="10" fill="#59636e" text-anchor="middle" font-weight="normal">출하 기본</text><text x="670.0" y="74" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="bold">ceiling-adjusted recall</text><line x1="550" y1="250" x2="790" y2="250" stroke="#d8dee4"/><rect x="580" y="136.4" width="70" height="113.6" rx="2" fill="#2563eb" opacity="0.9"/><text x="615" y="130.43200000000002" font-size="11" fill="#1f2328" text-anchor="middle" font-weight="bold">0.2028</text><text x="615" y="266" font-size="10" fill="#59636e" text-anchor="middle" font-weight="normal">측정 빌드</text><rect x="680" y="144.5" width="70" height="105.5" rx="2" fill="#ea580c" opacity="0.45" stroke="#ea580c" stroke-dasharray="4 3"/><text x="715" y="138.49599999999998" font-size="11" fill="#1f2328" text-anchor="middle" font-weight="bold">0.1884</text><text x="715" y="266" font-size="10" fill="#59636e" text-anchor="middle" font-weight="normal">출하 기본</text><text x="20" y="286" font-size="11" fill="#59636e" text-anchor="start" font-weight="normal">파랑 = sentence window (측정한 빌드), 주황 = max_dist=1 + REC (출하 기본). 흐린 막대 = 실측이 아닌 추정</text><text x="20" y="304" font-size="11" fill="#59636e" text-anchor="start" font-weight="normal">출하 기본의 recall 0.1884 는 채택 당시 판정 계약 기준 추정이다. ruled 재가격은 측정 빌드 쪽만 0.2028 로 올렸다</text><text x="792" y="324" font-size="9" fill="#8b949e" text-anchor="end">생성: python scripts/figures/ontosmith_figures.py · 손으로 고치지 말 것</text></svg>