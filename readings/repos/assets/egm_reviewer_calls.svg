ns</text><text x="690" y="103" font-size="11" fill="#59636e" text-anchor="start" font-weight="normal">6개 · concept</text><text x="20" y="137" font-size="12" fill="#1f2328" text-anchor="start" font-weight="bold">Stage 5</text><text x="20" y="151" font-size="10" fill="#59636e" text-anchor="start" font-weight="normal">Initial Zoom Out</text><rect x="190" y="122" width="78" height="30" rx="4" fill="#2563eb" opacity="0.85"/><text x="229.0" y="141" font-size="9" fill="#ffffff" text-anchor="middle" font-weight="normal">zoom-out</text><text x="280" y="141" font-size="11" fill="#59636e" text-anchor="start" font-weight="normal">1개 · full file</text><text x="20" y="175" font-size="12" fill="#1f2328" text-anchor="start" font-weight="bold">Stage 6</text><text x="20" y="189" font-size="10" fill="#59636e" text-anchor="start" font-weight="normal">Comprehension Test</text><rect x="190" y="160" width="78" height="30" rx="4" fill="#2563eb" opacity="0.85"/><text x="229.0" y="179" font-size="9" fill="#ffffff" text-anchor="middle" font-weight="normal">comprehension</text><text x="280" y="179" font-size="11" fill="#59636e" text-anchor="start" font-weight="normal">1개 · Feature + Detailed</text><text x="20" y="213" font-size="12" fill="#1f2328" text-anchor="start" font-weight="bold">Stage 7</text><text x="20" y="227" font-size="10" fill="#59636e" text-anchor="start" font-weight="normal">Critic Review</text><rect x="190" y="198" width="78" height="30" rx="4" fill="#2563eb" opacity="0.85"/><text x="229.0" y="217" font-size="9" fill="#ffffff" text-anchor="middle" font-weight="normal">design</text><rect x="272" y="198" width="78" height="30" rx="4" fill="#2563eb" opacity="0.85"/><text x="311.0" y="217" font-size="9" fill="#ffffff" text-anchor="middle" font-weight="normal">structural</text><rect x="354" y="198" width="78" height="30" rx="4" fill="#2563eb" opacity="0.85"/><text x="393.0" y="217" font-size="9" fill="#ffffff" text-anchor="middle" font-weight="normal">style</text><text x="444" y="217" font-size="11" fill="#59636e" text-anchor="start" font-weight="normal">3개 · FeatureRange</text><text x="20" y="251" font-size="12" fill="#1f2328" text-anchor="start" font-weight="bold">Stage 8</text><text x="20" y="265" font-size="10" fill="#59636e" text-anchor="start" font-weight="normal">Intermediate Zoom Out</text><rect x="190" y="236" width="78" height="30" rx="4" fill="#2563eb" opacity="0.85"/><text x="229.0" y="255" font-size="9" fill="#ffffff" text-anchor="middle" font-weight="normal">zoom-out</text><text x="280" y="255" font-size="11" fill="#59636e" text-anchor="start" font-weight="normal">1개 · full file</text><text x="20" y="289" font-size="12" fill="#1f2328" text-anchor="start" font-weight="bold">Stage 9</text><text x="20" y="303" font-size="10" fill="#59636e" text-anchor="start" font-weight="normal">Implementation Readiness</text><rect x="190" y="274" width="78" height="30" rx="4" fill="#2563eb" opacity="0.85"/><text x="229.0" y="293" font-size="9" fill="#ffffff" text-anchor="middle" font-weight="normal">impl-readiness</text><rect x="272" y="274" width="78" height="30" rx="4" fill="#2563eb" opacity="0.85"/><text x="311.0" y="293" font-size="9" fill="#ffffff" text-anchor="middle" font-weight="normal">codebase</text><rect x="354" y="274" width="78" height="30" rx="4" fill="#2563eb" opacity="0.85"/><text x="393.0" y="293" font-size="9" fill="#ffffff" text-anchor="middle" font-weight="normal">style</text><text x="444" y="293" font-size="11" fill="#59636e" text-anchor="start" font-weight="normal">3개 · DetailedRange</text><text x="20" y="330" font-size="13" fill="#1f2328" text-anchor="start" font-weight="bold">합계 6 + 9 = 15개</text><text x="20" y="350" font-size="11" fill="#59636e" text-anchor="start" font-weight="normal">TESTING.md 의 Codex · Muse 전체 실행 기록 "15 native reviewers" 와 같다. A/B 이중 실행 시 review 쪽은 최대 18개</text><text x="20" y="368" font-size="11" fill="#59636e" text-anchor="start" font-weight="normal">stage 순서는 고정(5→9)이고 같은 stage 안의 reviewer 만 병렬로 돈다. Stage 6 은 synthesizer 없이 직접 띄운다</text><text x="792" y="398" font-size="9" fill="#8b949e" text-anchor="end">생성: python scripts/figures/egm_figures.py · 손으로 고치지 말 것</text></svg>