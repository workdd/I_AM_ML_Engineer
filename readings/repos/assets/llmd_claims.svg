<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" width="760" height="450" role="img" aria-label="llm-d README 성능 주장 배수 비교" style="max-width:100%;height:auto;font-family:-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><title>llm-d README 성능 주장 배수 비교</title><rect width="760" height="450" fill="#ffffff"/><text x="20" y="28" font-size="14.5" fill="#1f2328" text-anchor="start" font-weight="bold">README 성능 주장 6개를 배수 한 축에 모은 것 (비교 대상·하드웨어가 모두 다르다)</text><text x="20" y="46" font-size="11.5" fill="#59636e" text-anchor="start" font-weight="normal">가로축은 로그 배수. 감소율은 1/(1−감소율) 배로 바꿨다. 막대 오른쪽 글자가 비교 대상과 환경</text><line x1="170.0" y1="66" x2="170.0" y2="338" stroke="#d8dee4"/><text x="170.0" y="354" font-size="11" fill="#59636e" text-anchor="middle" font-weight="normal">1배</text><line x1="232.5" y1="66" x2="232.5" y2="338" stroke="#d8dee4"/><text x="232.5" y="354" font-size="11" fill="#59636e" text-anchor="middle" font-weight="normal">2배</text><line x1="295.0" y1="66" x2="295.0" y2="338" stroke="#d8dee4"/><text x="295.0" y="354" font-size="11" fill="#59636e" text-anchor="middle" font-weight="normal">4배</text><line x1="357.5" y1="66" x2="357.5" y2="338" stroke="#d8dee4"/><text x="357.5" y="354" font-size="11" fill="#59636e" text-anchor="middle" font-weight="normal">8배</text><line x1="420.0" y1="66" x2="420.0" y2="338" stroke="#d8dee4"/><text x="420.0" y="354" font-size="11" fill="#59636e" text-anchor="middle" font-weight="normal">16배</text><text x="160" y="86" font-size="12" fill="#1f2328" text-anchor="end" font-weight="bold">계층 KV 오프로딩</text><text x="160" y="101" font-size="10.5" fill="#59636e" text-anchor="end" font-weight="normal">처리량</text><rect x="170" y="78" width="237.3" height="18" rx="2" fill="#7c3aed" fill-opacity="0.85"/><text x="413.3133111147591" y="91" font-size="11" fill="#7c3aed" text-anchor="start" font-weight="bold">13.9배</text><text x="470" y="91" font-size="10.5" fill="#59636e" text-anchor="start" font-weight="normal">GPU only 대비 · H100 4장 · 동시 사용자 250</text><text x="160" y="130" font-size="12" fill="#1f2328" text-anchor="end" font-weight="bold">prefix-cache 라우팅</text><text x="160" y="145" font-size="10.5" fill="#59636e" text-anchor="end" font-weight="normal">출력 처리량</text><rect x="170" y="122" width="99.1" height="18" rx="2" fill="#2563eb" fill-opacity="0.85"/><text x="275.06015629507226" y="135" font-size="11" fill="#2563eb" text-anchor="start" font-weight="bold">3.0배</text><text x="470" y="135" font-size="10.5" fill="#59636e" text-anchor="start" font-weight="normal">round-robin 대비 · Llama 3.1 70B · MI300X 4장</text><text x="160" y="174" font-size="12" fill="#1f2328" text-anchor="end" font-weight="bold">prefix-cache 라우팅</text><text x="160" y="189" font-size="10.5" fill="#59636e" text-anchor="end" font-weight="normal">TTFT</text><rect x="170" y="166" width="62.5" height="18" rx="2" fill="#2563eb" fill-opacity="0.85"/><text x="238.5" y="179" font-size="11" fill="#2563eb" text-anchor="start" font-weight="bold">2.0배</text><text x="470" y="179" font-size="10.5" fill="#59636e" text-anchor="start" font-weight="normal">round-robin 대비 · 같은 환경</text><text x="160" y="218" font-size="12" fill="#1f2328" text-anchor="end" font-weight="bold">P/D 분리 (AWS)</text><text x="160" y="233" font-size="10.5" fill="#59636e" text-anchor="end" font-weight="normal">tokens/sec</text><rect x="170" y="210" width="47.8" height="18" rx="2" fill="#ea580c" fill-opacity="0.85"/><text x="223.84592164768605" y="223" font-size="11" fill="#ea580c" text-anchor="start" font-weight="bold">1.7배</text><text x="470" y="223" font-size="10.5" fill="#59636e" text-anchor="start" font-weight="normal">표준 vLLM 대비 최대 · GPT-OSS · B200</text><text x="160" y="262" font-size="12" fill="#1f2328" text-anchor="end" font-weight="bold">예측 지연 스케줄링</text><text x="160" y="277" font-size="10.5" fill="#59636e" text-anchor="end" font-weight="normal">TTFT · ITL</text><rect x="170" y="254" width="46.1" height="18" rx="2" fill="#16a34a" fill-opacity="0.85"/><text x="222.0603496353879" y="267" font-size="11" fill="#16a34a" text-anchor="start" font-weight="bold">1.7배</text><text x="470" y="267" font-size="10.5" fill="#59636e" text-anchor="start" font-weight="normal">휴리스틱 대비 40% 감소 · NVIDIA GPU</text><text x="160" y="306" font-size="12" fill="#1f2328" text-anchor="end" font-weight="bold">P/D 분리 (Oracle)</text><text x="160" y="321" font-size="10.5" fill="#59636e" text-anchor="end" font-weight="normal">처리량</text><rect x="170" y="298" width="8.6" height="18" rx="2" fill="#ea580c" fill-opacity="0.85"/><rect x="178.6" y="298" width="15.1" height="18" rx="2" fill="#ea580c" fill-opacity="0.35"/><text x="199.6569764533581" y="311" font-size="11" fill="#ea580c" text-anchor="start" font-weight="bold">1.1~1.3배</text><text x="470" y="311" font-size="10.5" fill="#59636e" text-anchor="start" font-weight="normal">동일 인프라 대비 · GPT-OSS-120B 등 · MI300X</text><text x="20" y="392" font-size="11" fill="#59636e" text-anchor="start" font-weight="normal">표에 없는 wide EP: 클러스터 50,000 tok/s, GPU당 약 3,100 tok/s → 16.1장 분량. "16×16 B200" 을 256장으로 읽으면 GPU당 195 tok/s 라 맞지 않는다</text><text x="20" y="410" font-size="11" fill="#59636e" text-anchor="start" font-weight="normal">출처는 README 가 링크한 각 블로그이며 저장소 안에 재현 자료가 없다. 막대 길이를 서로 비교하지 않는다</text><text x="20" y="428" font-size="11" fill="#59636e" text-anchor="start" font-weight="normal">색: 보라 = KV 계층, 파랑 = prefix 라우팅, 주황 = P/D 분리, 초록 = 지연 예측</text><text x="752" y="444" font-size="9" fill="#8b949e" text-anchor="end">생성: python scripts/figures/llmd_figures.py · 손으로 고치지 말 것</text></svg>