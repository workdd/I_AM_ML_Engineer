<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" aria-label="OntoSmith 보정 정밀도 분해" style="max-width:100%;height:auto;font-family:-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><title>OntoSmith 보정 정밀도 분해</title><rect width="800" height="400" fill="#ffffff"/><text x="20" y="28" font-size="15" fill="#1f2328" text-anchor="start" font-weight="bold">보정 정밀도 0.911 의 구성: 정확 일치 2,233 + 불일치 1,669 × p_A</text><text x="20" y="46" font-size="12" fill="#59636e" text-anchor="start" font-weight="normal">Tier-1 3,902개 (sentence-window 빌드). 불일치 풀은 표본 300개로 지지율을 추정해 곱한다</text><rect x="40.0" y="70" width="412.0" height="34" fill="#16a34a" opacity="0.85"/><text x="246.01742696053307" y="92" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">2,233</text><rect x="452.0" y="70" width="243.9" height="34" fill="#2563eb" opacity="0.85"/><text x="573.9736535110201" y="92" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">1,322</text><rect x="695.9" y="70" width="64.1" height="34" fill="#dc2626" opacity="0.85"/><text x="727.9562265504869" y="92" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">347</text><rect x="40" y="114" width="12" height="12" rx="2" fill="#16a34a"/><text x="58" y="124" font-size="11" fill="#59636e" text-anchor="start" font-weight="normal">gold 정확 일치 2,233</text><rect x="224" y="114" width="12" height="12" rx="2" fill="#2563eb"/><text x="242" y="124" font-size="11" fill="#59636e" text-anchor="start" font-weight="normal">불일치 중 지지 추정 1,322</text><rect x="417" y="114" width="12" height="12" rx="2" fill="#dc2626"/><text x="435" y="124" font-size="11" fill="#59636e" text-anchor="start" font-weight="normal">불일치 중 미지지 추정 347</text><text x="20" y="166" font-size="12" fill="#1f2328" text-anchor="start" font-weight="bold">같은 Tier-1 집합을 네 가지로 읽은 정밀도</text><text x="288" y="196" font-size="11" fill="#1f2328" text-anchor="end" font-weight="normal">raw (frozen scorer)</text><rect x="300" y="184" width="263.3" height="18" rx="2" fill="#8b949e" opacity="0.85"/><text x="569.258" y="198" font-size="11" fill="#1f2328" text-anchor="start" font-weight="bold">0.5723</text><text x="288" y="234" font-size="11" fill="#1f2328" text-anchor="end" font-weight="normal">TN-normalized</text><rect x="300" y="222" width="263.9" height="18" rx="2" fill="#8b949e" opacity="0.85"/><text x="569.856" y="236" font-size="11" fill="#1f2328" text-anchor="start" font-weight="bold">0.5736</text><text x="288" y="272" font-size="11" fill="#1f2328" text-anchor="end" font-weight="normal">보정, 정확 일치를 0.884 로 가격</text><rect x="300" y="260" width="388.5" height="18" rx="2" fill="#ca8a04" opacity="0.85"/><text x="694.518817529472" y="274" font-size="11" fill="#1f2328" text-anchor="start" font-weight="bold">0.8446</text><text x="288" y="310" font-size="11" fill="#1f2328" text-anchor="end" font-weight="normal">보정 (출하 수치)</text><rect x="300" y="298" width="419.1" height="18" rx="2" fill="#2563eb" opacity="0.85"/><text x="725.0551783700666" y="312" font-size="11" fill="#1f2328" text-anchor="start" font-weight="bold">0.9110</text><text x="20" y="374" font-size="11" fill="#59636e" text-anchor="start" font-weight="normal">정확 일치를 1.0 으로 치는 것은 추정식의 약속이다. 재검토한 일치 표본의 지지율(0.884)로 바꾸면 ≈ 0.845</text><text x="792" y="394" font-size="9" fill="#8b949e" text-anchor="end">생성: python scripts/figures/ontosmith_figures.py · 손으로 고치지 말 것</text></svg>