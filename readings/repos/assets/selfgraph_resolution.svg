<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-label="SelfGraph 이름 유사도 병합 구간" style="max-width:100%;height:auto;font-family:-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><title>SelfGraph 이름 유사도 병합 구간</title><rect width="760" height="330" fill="#ffffff"/><text x="20.0" y="28.0" font-size="15" fill="#1f2328" text-anchor="start" font-weight="bold">이름 유사도 구간별 엔티티 병합 규칙 (같은 타입, 기본값)</text><text x="20.0" y="48.0" font-size="11" fill="#59636e" text-anchor="start" font-weight="normal">유사도 = max(Jaro-Winkler, 내용 토큰 Jaccard). 예시 점수는 원문 문서 값</text><rect x="60.0" y="70" width="128.0" height="46" fill="#f6f8fa" stroke="#d8dee4"/><text x="124.0" y="98.0" font-size="11" fill="#59636e" text-anchor="middle" font-weight="bold">LLM 에도 묻지 않음</text><rect x="188.0" y="70" width="307.2" height="46" fill="#fff4e5" stroke="#d8dee4"/><text x="341.6" y="98.0" font-size="11" fill="#ea580c" text-anchor="middle" font-weight="bold">llm 단계: yes/no 질문 (후보당 최대 3회)</text><rect x="495.2" y="70" width="204.8" height="46" fill="#e8f5ec" stroke="#d8dee4"/><text x="597.6" y="98.0" font-size="11" fill="#16a34a" text-anchor="middle" font-weight="bold">fuzzy 단계: 바로 병합</text><line x1="60.0" y1="116" x2="60.0" y2="122" stroke="#59636e"/><text x="60.0" y="136.0" font-size="10" fill="#59636e" text-anchor="middle" font-weight="normal">0.75</text><line x1="188.0" y1="116" x2="188.0" y2="122" stroke="#59636e"/><text x="188.0" y="136.0" font-size="10" fill="#59636e" text-anchor="middle" font-weight="normal">0.8</text><line x1="316.0" y1="116" x2="316.0" y2="122" stroke="#59636e"/><text x="316.0" y="136.0" font-size="10" fill="#59636e" text-anchor="middle" font-weight="normal">0.85</text><line x1="444.0" y1="116" x2="444.0" y2="122" stroke="#59636e"/><text x="444.0" y="136.0" font-size="10" fill="#59636e" text-anchor="middle" font-weight="normal">0.9</text><line x1="495.2" y1="116" x2="495.2" y2="122" stroke="#59636e"/><text x="495.2" y="136.0" font-size="10" fill="#59636e" text-anchor="middle" font-weight="normal">0.92</text><line x1="700.0" y1="116" x2="700.0" y2="122" stroke="#59636e"/><text x="700.0" y="136.0" font-size="10" fill="#59636e" text-anchor="middle" font-weight="normal">1</text><line x1="213.6" y1="116" x2="213.6" y2="156" stroke="#dc2626" stroke-dasharray="2 3"/><circle cx="213.6" cy="162" r="5" fill="#dc2626"/><text x="223.6" y="160.0" font-size="11" fill="#1f2328" text-anchor="start" font-weight="bold">Bill Gates / William Gates (0.81)</text><text x="223.6" y="176.0" font-size="11" fill="#dc2626" text-anchor="start" font-weight="normal">구간 안이지만 단어 대응 없음 → 묻지 않고 분리</text><line x1="374.9" y1="116" x2="374.9" y2="200" stroke="#ea580c" stroke-dasharray="2 3"/><circle cx="374.9" cy="206" r="5" fill="#ea580c"/><text x="384.9" y="204.0" font-size="11" fill="#1f2328" text-anchor="start" font-weight="bold">Jon Smithers / Jonathan Smithers (0.873)</text><text x="384.9" y="220.0" font-size="11" fill="#ea580c" text-anchor="start" font-weight="normal">기본은 분리, LLM 이 yes 면 병합</text><line x1="638.6" y1="116" x2="638.6" y2="244" stroke="#16a34a" stroke-dasharray="2 3"/><circle cx="638.6" cy="250" r="5" fill="#16a34a"/><text x="628.6" y="248.0" font-size="11" fill="#1f2328" text-anchor="end" font-weight="bold">Jonathan Smithers / Jonathon Smithers (0.976)</text><text x="628.6" y="264.0" font-size="11" fill="#16a34a" text-anchor="end" font-weight="normal">fuzzy 에서 바로 병합</text><text x="20.0" y="308.0" font-size="11" fill="#59636e" text-anchor="start" font-weight="normal">숫자열, 한 글자 단어, Jr/II 같은 접미사가 다르거나 단어 대응이 없으면 유사도와 무관하게 병합하지 않는다</text><text x="752" y="324" font-size="9" fill="#8b949e" text-anchor="end">생성: python scripts/figures/selfgraph_figures.py, 손으로 고치지 말 것</text></svg>