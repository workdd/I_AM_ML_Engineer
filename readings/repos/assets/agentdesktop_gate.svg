<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" role="img" aria-label="JEV 도우미 신뢰도와 위험 게이트" style="max-width:100%;height:auto;font-family:-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><title>JEV 도우미 신뢰도와 위험 게이트</title><rect width="760" height="430" fill="#ffffff"/><text x="20" y="28" font-size="14.5" fill="#1f2328" text-anchor="start" font-weight="bold">JEV 도우미(run.mjs)가 한 단계를 실행할지 정하는 규칙</text><text x="20" y="46" font-size="11.5" fill="#59636e" text-anchor="start" font-weight="normal">가로 = 모델이 고른 대상의 신뢰도, 세로 = 두 번째 모델 호출이 매긴 위험 점수. 원문 문장 규칙을 평면에 펼침</text><rect x="90.0" y="74.0" width="107.5" height="260.0" fill="#f3f4f6"/><rect x="197.5" y="74.0" width="107.5" height="260.0" fill="#fee2e2"/><rect x="305.0" y="204.0" width="143.3" height="130.0" fill="#dcfce7"/><rect x="305.0" y="74.0" width="143.3" height="130.0" fill="#fee2e2"/><rect x="448.3" y="74.0" width="71.7" height="260.0" fill="#fef3c7"/><line x1="90.0" y1="74" x2="90.0" y2="334" stroke="#8b949e" stroke-dasharray=""/><text x="90.0" y="350" font-size="11" fill="#59636e" text-anchor="middle" font-weight="normal">0.40</text><line x1="197.5" y1="74" x2="197.5" y2="334" stroke="#1f2328" stroke-dasharray="4 3"/><text x="197.50000000000003" y="350" font-size="11" fill="#59636e" text-anchor="middle" font-weight="normal">0.55</text><line x1="305.0" y1="74" x2="305.0" y2="334" stroke="#1f2328" stroke-dasharray="4 3"/><text x="305.0" y="350" font-size="11" fill="#59636e" text-anchor="middle" font-weight="normal">0.70</text><line x1="448.3" y1="74" x2="448.3" y2="334" stroke="#1f2328" stroke-dasharray="4 3"/><text x="448.33333333333337" y="350" font-size="11" fill="#59636e" text-anchor="middle" font-weight="normal">0.90</text><line x1="520.0" y1="74" x2="520.0" y2="334" stroke="#8b949e" stroke-dasharray=""/><text x="520.0" y="350" font-size="11" fill="#59636e" text-anchor="middle" font-weight="normal">1.00</text><text x="82" y="338" font-size="11" fill="#59636e" text-anchor="end" font-weight="normal">0.0</text><text x="82" y="208.0" font-size="11" fill="#59636e" text-anchor="end" font-weight="normal">0.5</text><text x="82" y="78.0" font-size="11" fill="#59636e" text-anchor="end" font-weight="normal">1.0</text><line x1="305.0" y1="204.0" x2="448.3" y2="204.0" stroke="#1f2328" stroke-dasharray="4 3"/><rect x="90" y="74" width="430" height="260" fill="none" stroke="#8b949e"/><text x="305.0" y="368" font-size="11" fill="#59636e" text-anchor="middle" font-weight="normal">대상 신뢰도</text><text x="30" y="64" font-size="11" fill="#59636e" text-anchor="start" font-weight="normal">위험 점수</text><text x="143.74999999999997" y="204.0" font-size="11.5" fill="#8b949e" text-anchor="middle" font-weight="bold">실행 없음</text><text x="251.24999999999997" y="204.0" font-size="11.5" fill="#dc2626" text-anchor="middle" font-weight="bold">멈춤</text><text x="251.24999999999997" y="219.0" font-size="10" fill="#dc2626" text-anchor="middle" font-weight="normal">후보 알림</text><text x="376.6666666666667" y="269.0" font-size="11.5" fill="#16a34a" text-anchor="middle" font-weight="bold">실행</text><text x="376.6666666666667" y="139.0" font-size="11" fill="#dc2626" text-anchor="middle" font-weight="bold">destructive</text><text x="376.6666666666667" y="154.0" font-size="10.5" fill="#dc2626" text-anchor="middle" font-weight="normal">→ 멈춤</text><text x="484.16666666666663" y="191.0" font-size="10.5" fill="#ca8a04" text-anchor="middle" font-weight="bold">평가 없이</text><text x="484.16666666666663" y="205.0" font-size="10.5" fill="#ca8a04" text-anchor="middle" font-weight="bold">실행</text><rect x="560" y="80" width="14" height="14" fill="#dcfce7" stroke="#16a34a"/><text x="582" y="91" font-size="11" fill="#1f2328" text-anchor="start" font-weight="normal">실행</text><rect x="560" y="104" width="14" height="14" fill="#fef3c7" stroke="#ca8a04"/><text x="582" y="115" font-size="11" fill="#1f2328" text-anchor="start" font-weight="normal">위험 평가 호출 없이 실행</text><rect x="560" y="128" width="14" height="14" fill="#fee2e2" stroke="#dc2626"/><text x="582" y="139" font-size="11" fill="#1f2328" text-anchor="start" font-weight="normal">멈추고 사람에게 넘김</text><rect x="560" y="152" width="14" height="14" fill="#f3f4f6" stroke="#8b949e"/><text x="582" y="163" font-size="11" fill="#1f2328" text-anchor="start" font-weight="normal">실행하지 않음</text><text x="560" y="204" font-size="10.5" fill="#59636e" text-anchor="start" font-weight="normal">일반 단계 기준 0.70</text><text x="560" y="221" font-size="10.5" fill="#59636e" text-anchor="start" font-weight="normal">위험 0.50 이상 = destructive,</text><text x="560" y="238" font-size="10.5" fill="#59636e" text-anchor="start" font-weight="normal">  기준 0.90</text><text x="560" y="255" font-size="10.5" fill="#59636e" text-anchor="start" font-weight="normal">0.55 미만은 실행 없음</text><text x="560" y="272" font-size="10.5" fill="#59636e" text-anchor="start" font-weight="normal">위험 점수가 오지 않으면</text><text x="560" y="289" font-size="10.5" fill="#59636e" text-anchor="start" font-weight="normal">  destructive 로 간주</text><text x="20" y="390" font-size="11" fill="#59636e" text-anchor="start" font-weight="normal">노란 띠: 신뢰도 0.90 이상이면 위험을 묻지 않으므로, 위험한 단계도 그대로 실행된다(원문이 밝힌 동작)</text><text x="20" y="408" font-size="11" fill="#59636e" text-anchor="start" font-weight="normal">--confirm-destructive 를 주면 destructive 로 평가된 모든 단계에서 확인을 받는다. act.mjs 는 한 요청 안에서 위험을 함께 받는다</text><text x="752" y="424" font-size="9" fill="#8b949e" text-anchor="end">생성: python scripts/figures/agentdesktop_figures.py · 손으로 고치지 말 것</text></svg>