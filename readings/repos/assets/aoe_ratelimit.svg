<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-label="rate limit 실행의 실패 분해와 health gate" style="max-width:100%;height:auto;font-family:-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><title>rate limit 실행의 실패 분해와 health gate</title><rect width="760" height="330" fill="#ffffff"/><text x="20" y="28" font-size="15" fill="#1f2328" text-anchor="start" font-weight="bold">rate limit 에 막힌 60문항 실행이 '약한 모델' 처럼 보인 과정</text><text x="20" y="48" font-size="11" fill="#59636e" text-anchor="start" font-weight="normal">BIRD 60문항 · 8 workers. 빨강 = 실패 몫, 노란 선 = health gate 5%</text><text x="190" y="97" font-size="13" fill="#1f2328" text-anchor="end" font-weight="normal">HTTP 호출</text><rect x="200" y="80" width="500" height="26" fill="#d8dee4" rx="3"/><rect x="200" y="80" width="331.7" height="26" fill="#dc2626" rx="3"/><text x="234" y="97" font-size="12" fill="#ffffff" text-anchor="start" font-weight="bold">429 응답 747 / 1126 (66%)</text><text x="190" y="147" font-size="13" fill="#1f2328" text-anchor="end" font-weight="normal">문항</text><rect x="200" y="130" width="500" height="26" fill="#d8dee4" rx="3"/><rect x="200" y="130" width="308.3" height="26" fill="#dc2626" rx="3"/><text x="234" y="147" font-size="12" fill="#ffffff" text-anchor="start" font-weight="bold">빈 SQL 37 / 60 (62%)</text><line x1="225.0" y1="124" x2="225.0" y2="162" stroke="#ca8a04" stroke-width="3"/><text x="229.0" y="174" font-size="11" fill="#ca8a04" text-anchor="start" font-weight="bold">health gate 5%: 이 선을 넘으면 compare 가 대표 수치 출력을 거부</text><text x="190" y="227" font-size="13" fill="#1f2328" text-anchor="end" font-weight="normal">보고된 EX</text><rect x="200" y="210" width="500" height="26" fill="#d8dee4" rx="3"/><rect x="200" y="210" width="66.5" height="26" fill="#8b949e" rx="3"/><text x="274.5" y="227" font-size="12" fill="#1f2328" text-anchor="start" font-weight="normal">13.3%: 오류 칸이 비어 있어 모델 성능처럼 읽힘</text><text x="20" y="302" font-size="11" fill="#59636e" text-anchor="start" font-weight="normal">재시도 3회 뒤 유효한 종료 상태(unconstructable_sql_response)로 끝나 오류로 집계되지 않았다</text><text x="752" y="324" font-size="9" fill="#8b949e" text-anchor="end">생성: python scripts/figures/aoe_figures.py · 손으로 고치지 말 것</text></svg>