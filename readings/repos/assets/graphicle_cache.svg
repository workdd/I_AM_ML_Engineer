<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="680" height="400" role="img" aria-label="프롬프트 캐시 레이아웃별 비용과 포함 비율" style="max-width:100%;height:auto;font-family:-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><title>프롬프트 캐시 레이아웃별 비용과 포함 비율</title><rect width="680" height="400" fill="#ffffff"/><text x="20" y="28" font-size="14" fill="#1f2328" text-anchor="start" font-weight="bold">1M 토큰 문맥의 후속 질문 입력 비용과 수정 파일 포함 비율 (Muse Spark 1.3, 정가 계산)</text><text x="20" y="46" font-size="12" fill="#59636e" text-anchor="start" font-weight="normal">앞부분을 질문과 무관하게 고정할수록 캐시로 싸지지만, 질문에 쓸 몫이 줄어 포함 비율이 내려간다</text><text x="110" y="70" font-size="11" fill="#59636e" text-anchor="start" font-weight="normal">후속 질문 1회 입력 비용 ($)</text><text x="550" y="70" font-size="11" fill="#59636e" text-anchor="middle" font-weight="normal">포함 비율</text><text x="100" y="97" font-size="12" fill="#1f2328" text-anchor="end" font-weight="normal">standard</text><rect x="110" y="84" width="330.0" height="20" fill="#ea580c"/><text x="446.0" y="97" font-size="11" fill="#1f2328" text-anchor="start" font-weight="normal">$1.27</text><text x="550" y="97" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="bold">96.2%</text><text x="100" y="129" font-size="12" fill="#1f2328" text-anchor="end" font-weight="normal">cache 50%</text><rect x="110" y="116" width="158.5" height="20" fill="#2563eb"/><text x="274.503937007874" y="129" font-size="11" fill="#1f2328" text-anchor="start" font-weight="normal">$0.61</text><text x="550" y="129" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="bold">95.9%</text><text x="100" y="161" font-size="12" fill="#1f2328" text-anchor="end" font-weight="normal">cache 70%</text><rect x="110" y="148" width="112.5" height="20" fill="#2563eb"/><text x="228.51181102362204" y="161" font-size="11" fill="#1f2328" text-anchor="start" font-weight="normal">$0.433</text><text x="550" y="161" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="bold">92.9%</text><text x="100" y="193" font-size="12" fill="#1f2328" text-anchor="end" font-weight="normal">cache 90%</text><rect x="110" y="180" width="65.5" height="20" fill="#2563eb"/><text x="181.48031496062993" y="193" font-size="11" fill="#1f2328" text-anchor="start" font-weight="normal">$0.252</text><text x="550" y="193" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="bold">94.4%</text><text x="100" y="225" font-size="12" fill="#1f2328" text-anchor="end" font-weight="normal">cache 95%</text><rect x="110" y="212" width="53.0" height="20" fill="#2563eb"/><text x="169.00787401574803" y="225" font-size="11" fill="#1f2328" text-anchor="start" font-weight="normal">$0.204</text><text x="550" y="225" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="bold">92.1%</text><text x="100" y="257" font-size="12" fill="#1f2328" text-anchor="end" font-weight="normal">stable</text><rect x="110" y="244" width="39.8" height="20" fill="#8b949e"/><text x="155.75590551181102" y="257" font-size="11" fill="#1f2328" text-anchor="start" font-weight="normal">$0.153</text><text x="550" y="257" font-size="12" fill="#ea580c" text-anchor="middle" font-weight="bold">18.2%</text><text x="100" y="289" font-size="12" fill="#1f2328" text-anchor="end" font-weight="normal">자른 저장소</text><rect x="110" y="276" width="39.8" height="20" fill="#8b949e"/><text x="155.75590551181102" y="289" font-size="11" fill="#1f2328" text-anchor="start" font-weight="normal">$0.153</text><text x="550" y="289" font-size="12" fill="#ea580c" text-anchor="middle" font-weight="bold">7.0%</text><text x="20" y="320" font-size="11" fill="#59636e" text-anchor="start" font-weight="normal">cache N%: 저장소 부분이 예산의 N%. stable은 질문 부분 781토큰만 남는다. 개발 저장소(kubernetes, home-assistant) 평균</text><text x="20" y="338" font-size="11" fill="#59636e" text-anchor="start" font-weight="normal">청구 금액이 아니라 정가로 계산한 값이다. 캐시 적중 여부는 API가 정한다</text><text x="672" y="394" font-size="9" fill="#8b949e" text-anchor="end">생성: pyt