<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" role="img" aria-label="pg-jev 버전별 실측 시간" style="max-width:100%;height:auto;font-family:-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><title>pg-jev 버전별 실측 시간</title><rect width="760" height="360" fill="#ffffff"/><text x="20" y="28" font-size="14.5" fill="#1f2328" text-anchor="start" font-weight="bold">v0.1.0 → v0.2.x: 2,000행 테이블 실측 시간 (유럽, API까지 약 190ms)</text><text x="20" y="46" font-size="11.5" fill="#59636e" text-anchor="start" font-weight="normal">스트리밍 미리 읽기 · 영속 연결 · 20행 묶음 · 동시 요청 16개로 바꾼 결과</text><line x1="250.0" y1="68" x2="250.0" y2="282" stroke="#d8dee4"/><text x="250.0" y="298" font-size="11" fill="#59636e" text-anchor="middle" font-weight="normal">0초</text><line x1="396.7" y1="68" x2="396.7" y2="282" stroke="#d8dee4"/><text x="396.66666666666663" y="298" font-size="11" fill="#59636e" text-anchor="middle" font-weight="normal">3초</text><line x1="543.3" y1="68" x2="543.3" y2="282" stroke="#d8dee4"/><text x="543.3333333333333" y="298" font-size="11" fill="#59636e" text-anchor="middle" font-weight="normal">6초</text><line x1="690.0" y1="68" x2="690.0" y2="282" stroke="#d8dee4"/><text x="690.0" y="298" font-size="11" fill="#59636e" text-anchor="middle" font-weight="normal">9초</text><text x="240" y="96" font-size="12" fill="#1f2328" text-anchor="end" font-weight="normal">전체 스캔, 새 조건</text><rect x="250" y="74" width="415.6" height="16" rx="2" fill="#8b949e"/><text x="671.5555555555555" y="86" font-size="11" fill="#59636e" text-anchor="start" font-weight="normal">v0.1.0 8.5초</text><rect x="250" y="93" width="171.1" height="16" rx="2" fill="#2563eb"/><text x="427.1111111111111" y="105" font-size="11" fill="#2563eb" text-anchor="start" font-weight="normal">v0.2.x 3.5초 (2.4배 빠름)</text><text x="240" y="148" font-size="12" fill="#1f2328" text-anchor="end" font-weight="normal">LIMIT 3, 새 조건</text><rect x="250" y="126" width="410.7" height="16" rx="2" fill="#8b949e"/><t