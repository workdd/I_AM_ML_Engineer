<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-label="Nemotron 3 Ultra 벤치마크 검산" style="max-width:100%;height:auto;font-family:-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><title>Nemotron 3 Ultra 벤치마크 검산</title><rect width="760" height="400" fill="#ffffff"/><text x="20" y="28" font-size="14.5" fill="#1f2328" text-anchor="start" font-weight="bold">Nemotron 3 Ultra (H200 8노드, 동시 코딩 세션 60): k8s Service 대비 llm-d</text><text x="20" y="46" font-size="11.5" fill="#59636e" text-anchor="start" font-weight="normal">왼쪽은 원문 표의 변화율 검산, 오른쪽은 처리량 안에서 입력·출력 토큰이 차지하는 몫</text><line x1="144.7" y1="76" x2="144.7" y2="284" stroke="#d8dee4"/><text x="144.7058823529412" y="300" font-size="10.5" fill="#59636e" text-anchor="middle" font-weight="normal">-60%</text><line x1="188.8" y1="76" x2="188.8" y2="284" stroke="#d8dee4"/><text x="188.8235294117647" y="300" font-size="10.5" fill="#59636e" text-anchor="middle" font-weight="normal">-30%</text><line x1="232.9" y1="76" x2="232.9" y2="284" stroke="#8b949e"/><text x="232.94117647058823" y="300" font-size="10.5" fill="#59636e" text-anchor="middle" font-weight="normal">0</text><line x1="277.1" y1="76" x2="277.1" y2="284" stroke="#d8dee4"/><text x="277.05882352941177" y="300" font-size="10.5" fill="#59636e" text-anchor="middle" font-weight="normal">+30%</text><line x1="321.2" y1="76" x2="321.2" y2="284" stroke="#d8dee4"/><text x="321.1764705882353" y="300" font-size="10.5" fill="#59636e" text-anchor="middle" font-weight="normal">+60%</text><line x1="365.3" y1="76" x2="365.3" y2="284" stroke="#d8dee4"/><text x="365.2941176470588" y="300" font-size="10.5" fill="#59636e" text-anchor="middle" font-weight="normal">+90%</text><text x="120" y="100" font-size="11.5" fill="#1f2328" text-anchor="end" font-weight="normal">TTFT P50 (ms)</text><rect x="147.0" y="88" width="86.0" height="18" rx="2" fill="#16a34a"/><text x="238.94117647058823" y="101" font-size="10.5" fill="#1f2328" text-anchor="start" font-weight="normal">-58.5% (원문 -58%)</text><text x="120" y="150" font-size="11.5" fill="#1f2328" text-anchor="end" font-weight="normal">Total tok/s</text><rect x="232.9" y="138" width="6.1" height="18" rx="2" fill="#16a34a"/><text x="245.02429261984668" y="151" font-size="10.5" fill="#1f2328" text-anchor="start" font-weight="normal">+4.1% (원문 +4%)</text><text x="120" y="200" font-size="11.5" fill="#1f2328" text-anchor="end" font-weight="normal">Input tok/s</text><rect x="232.9" y="188" width="5.1" height="18" rx="2" fill="#16a34a"/><text x="244.05495694570908" y="201" font-size="10.5" fill="#1f2328" text-anchor="start" font-weight="normal">+3.5% (원문 +3%)</text><text x="120" y="250" font-size="11.5" fill="#1f2328" text-anchor="end" font-weight="normal">Output tok/s</text><rect x="232.9" y="238" width="135.2" height="18" rx="2" fill="#16a34a"/><text x="362.150218765192" y="251" font-size="10.5" fill="#ffffff" text-anchor="end" font-weight="bold">+91.9% (원문 +92%)</text><text x="470" y="70" font-size="11" fill="#59636e" text-anchor="start" font-weight="normal">총 처리량 중 출력 토큰 몫</text><text x="470" y="90" font-size="11" fill="#1f2328" text-anchor="start" font-weight="normal">k8s Service: 총 64,958 tok/s</text><rect x="470" y="94" width="270" height="16" rx="2" fill="#d8dee4"/><rect x="470" y="94" width="20.1" height="16" rx="2" fill="#2563eb"/><text x="496.11761445857326" y="106" font-size="10.5" fill="#2563eb" text-anchor="start" font-weight="normal">출력 0.7%</text><text x="470" y="150" font-size="11" fill="#1f2328" text-anchor="start" font-weight="normal">llm-d: 총 67,645 tok/s</text><rect x="470" y="154" width="270" height="16" rx="2" fill="#d8dee4"/><rect x="470" y="154" width="37.1" height="16" rx="2" fill="#2563eb"/><text x="513.0803459235716" y="166" font-size="10.5" fill="#2563eb" text-anchor="start" font-weight="normal">출력 1.4%</text><text x="470" y="234" font-size="10.5" fill="#59636e" text-anchor="start" font-weight="normal">출력 막대는 10배 확대 (회색 = 전체)</text><text x="470" y="256" font-size="11" fill="#1f2328" text-anchor="start" font-weight="normal">총 증가 2,687 tok/s 중 출력 증가 445</text><text x="470" y="274" font-size="11" fill="#1f2328" text-anchor="start" font-weight="normal">= 17%. 나머지는 입력(prefill)</text><text x="20" y="360" font-size="11" fill="#59636e" text-anchor="start" font-weight="normal">워크로드는 동적 시스템 프롬프트 평균 160,000 토큰, 턴당 입력 1,500 · 출력 425 토큰. prefill 이 처리량을 정한다</text><text x="20" y="378" font-size="11" fill="#59636e" text-anchor="start" font-weight="normal">출력 92% 증가는 절대량이 작다. 주된 변화는 TTFT 58% 감소다. Input 원문 3% 는 3.5% 를 내린 값</text><text x="752" y="394" font-size="9" fill="#8b949e" text-anchor="end">생성: python scripts/figures/llmd_figures.py · 손으로 고치지 말 것</text></svg>