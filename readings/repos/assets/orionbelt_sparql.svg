<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-label="OrionBelt SPARQL 엔진 선택 기준" style="max-width:100%;height:auto;font-family:-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><title>OrionBelt SPARQL 엔진 선택 기준</title><rect width="760" height="330" fill="#ffffff"/><text x="20.0" y="28.0" font-size="15" fill="#1f2328" text-anchor="start" font-weight="bold">SPARQL 엔진 자동 선택: 온톨로지 트리플 수 기준</text><text x="20.0" y="48.0" font-size="11" fill="#59636e" text-anchor="start" font-weight="normal">기본 제한은 두 엔진 모두 10초, 1,000행. 측정값은 원문 코드 주석(페이지 예제 질의 기준)</text><rect x="60" y="76" width="361.9" height="46" fill="#eef4ff" stroke="#d8dee4"/><text x="240.9" y="104.0" font-size="12" fill="#2563eb" text-anchor="middle" font-weight="bold">rdflib (앱 프로세스 안, store proxy 가 deadline 확인)</text><rect x="421.9" y="76" width="278.1" height="46" fill="#e8f5ec" stroke="#d8dee4"/><text x="560.9" y="104.0" font-size="12" fill="#16a34a" text-anchor="middle" font-weight="bold">Oxigraph (worker 프로세스, 제한 시간에 종료)</text><line x1="60.0" y1="122" x2="60.0" y2="128" stroke="#59636e"/><text x="60.0" y="142.0" font-size="10" fill="#59636e" text-anchor="middle" font-weight="normal">1,000</text><line x1="338.1" y1="122" x2="338.1" y2="128" stroke="#59636e"/><text x="338.1" y="142.0" font-size="10" fill="#59636e" text-anchor="middle" font-weight="normal">10,000</text><line x1="616.3" y1="122" x2="616.3" y2="128" stroke="#59636e"/><text x="616.3" y="142.0" font-size="10" fill="#59636e" text-anchor="middle" font-weight="normal">100,000</text><line x1="700.0" y1="122" x2="700.0" y2="128" stroke="#59636e"/><text x="700.0" y="142.0" font-size="10" fill="#59636e" text-anchor="middle" font-weight="normal">200,000</text><line x1="318.5" y1="122" x2="318.5" y2="162" stroke="#59636e" stroke-dasharray="3 3"/><circle cx="318.5" cy="167" r="4.5" fill="#59636e"/><text x="308.5" y="171.0" font-size="11" fill="#59636e" text-anchor="end" font-weight="bold">8,500: 두 엔진 속도 비슷</text><line x1="421.9" y1="122" x2="421.9" y2="192" stroke="#1f2328" stroke-dasharray="3 3"/><circle cx="421.9" cy="197" r="4.5" fill="#1f2328"/><text x="431.9" y="201.0" font-size="11" fill="#1f2328" text-anchor="start" font-weight="bold">20,000: 전환 기준</text><line x1="514.3" y1="122" x2="514.3" y2="222" stroke="#16a34a" stroke-dasharray="3 3"/><circle cx="514.3" cy="227" r="4.5" fill="#16a34a"/><text x="524.3" y="231.0" font-size="11" fill="#16a34a" text-anchor="start" font-weight="bold">43,000: Oxigraph 2~8배 빠름</text><text x="20.0" y="286.0" font-size="11" fill="#59636e" text-anchor="start" font-weight="normal">크기와 무관하게 rdflib 로 보내는 질의: 역참조, lookaround 가 있는 REGEX, 대소문자 섞인 언어 태그의 lang()</text><text x="20.0" y="304.0" font-size="11" fill="#59636e" text-anchor="start" font-weight="normal">Oxigraph 답이 달라지는 지점: 1.50 → 1.5, "a" 와 "a"^^xsd:string 동일, decimal 18자리, 다국어 ORDER BY</text><text x="752" y="324" font-size="9" fill="#8b949e" text-anchor="end">생성: python scripts/figures/orionbelt_figures.py, 손으로 고치지 말 것</text></svg>