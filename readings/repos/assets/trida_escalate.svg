<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480" role="img" aria-label="Zoro-1 reasoned action 문턱별 비용과 회수율" style="max-width:100%;height:auto;font-family:-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><title>Zoro-1 reasoned action 문턱별 비용과 회수율</title><rect width="800" height="480" fill="#ffffff"/><text x="20" y="28" font-size="15" fill="#1f2328" text-anchor="start" font-weight="bold">확신도 0.7 미만만 reasoning 으로 넘기면, 요청 29–42% 비용으로 정확도 이득의 69–82% 를 회수한다</text><text x="20" y="46" font-size="11" fill="#59636e" text-anchor="start" font-weight="normal">Zoro-1 모델 카드의 escalation 표를 다시 계산: 회수율 = (문턱 정확도 − direct) ÷ (항상 reasoning − direct)</text><line x1="80" y1="390.0" x2="560" y2="390.0" stroke="#d8dee4" stroke-width="1"/><text x="72" y="394.0" font-size="10" fill="#59636e" text-anchor="end" font-weight="normal">0%</text><line x1="80" y1="319.5" x2="560" y2="319.5" stroke="#d8dee4" stroke-width="1"/><text x="72" y="323.54545454545456" font-size="10" fill="#59636e" text-anchor="end" font-weight="normal">25%</text><line x1="80" y1="249.1" x2="560" y2="249.1" stroke="#d8dee4" stroke-width="1"/><text x="72" y="253.0909090909091" font-size="10" fill="#59636e" text-anchor="end" font-weight="normal">50%</text><line x1="80" y1="178.6" x2="560" y2="178.6" stroke="#d8dee4" stroke-width="1"/><text x="72" y="182.63636363636365" font-size="10" fill="#59636e" text-anchor="end" font-weight="normal">75%</text><line x1="80" y1="108.2" x2="560" y2="108.2" stroke="#1f2328" stroke-width="1"/><text x="72" y="112.18181818181819" font-size="10" fill="#59636e" text-anchor="end" font-weight="normal">100%</text><text x="80.0" y="406" font-size="10" fill="#59636e" text-anchor="middle" font-weight="normal">0%</text><text x="176.0" y="406" font-size="10" fill="#59636e" text-anchor="middle" font-weight="normal">20%</text><text x="272.0" y="406" font-size="10" fill="#59636e" text-anchor="middle" font-weight="normal">40%</text><text x="368.0" y="406" font-size="10" fill="#59636e" text-anchor="middle" font-weight="normal">60%</text><text x="464.0" y="406" font-size="10" fill="#59636e" text-anchor="middle" font-weight="normal">80%</text><text x="560.0" y="406" font-size="10" fill="#59636e" text-anchor="middle" font-weight="normal">100%</text><line x1="80" y1="390.0" x2="560.0" y2="108.2" stroke="#8b949e" stroke-dasharray="4 3"/><text x="416.0" y="215.2727272727273" font-size="10" fill="#8b949e" text-anchor="middle" font-weight="normal">비용에 비례하는 선</text><text x="320.0" y="424" font-size="11" fill="#1f2328" text-anchor="middle" font-weight="normal">reasoning 으로 넘긴 요청 비율 (= 생성 비용)</text><text x="30" y="235.0" font-size="11" fill="#1f2328" text-anchor="middle" transform="rotate(-90 30 235.0)">항상 reasoning 대비 정확도 이득 회수율</text><polyline points="80.0,390.0 137.6,250.3 219.2,173.0 358.4,140.6 560.0,108.2" fill="none" stroke="#2563eb" stroke-width="2"/><circle cx="137.6" cy="250.3" r="3.5" fill="#2563eb"/><circle cx="219.2" cy="173.0" r="5" fill="#2563eb"/><text x="227.2" y="177.0249396621079" font-size="11" fill="#2563eb" text-anchor="start" font-weight="bold">77%</text><circle cx="358.4" cy="140.6" r="3.5" fill="#2563eb"/><polyline points="80.0,390.0 142.4,312.8 281.6,158.4 406.4,104.3 560.0,108.2" fill="none" stroke="#ea580c" stroke-width="2"/><circle cx="142.4" cy="312.8" r="3.5" fill="#ea580c"/><circle cx="281.6" cy="158.4" r="5" fill="#ea580c"/><text x="279.6" y="148.36861768368607" font-size="11" fill="#ea580c" text-anchor="end" font-weight="bold">82%</text><circle cx="406.4" cy="104.3" r="3.5" fill="#ea580c"/><polyline points="80.0,390.0 108.8,380.3 219.2,195.6 382.4,113.0 560.0,108.2" fill="none" stroke="#16a34a" stroke-width="2"/><circle cx="108.8" cy="380.3" r="3.5" fill="#16a34a"/><circle cx="219.2" cy="195.6" r="5" fill="#16a34a"/><text x="227.2" y="199.6426332288403" font-size="11" fill="#16a34a" text-anchor="start" font-weight="bold">69%</text><circle cx="382.4" cy="113.0" r="3.5" fill="#16a34a"/><text x="590" y="84" font-size="12" fill="#1f2328" text-anchor="start" font-weight="bold">문턱 (top 확률 미만이면 reasoning)</text><text x="590" y="102" font-size="10" fill="#59636e" text-anchor="start" font-weight="normal">점 3개 = 0.5 · 0.7 · 0.9 (큰 점 0.7)</text><rect x="590" y="120" width="12" height="12" fill="#2563eb"/><text x="608" y="130" font-size="11" fill="#1f2328" text-anchor="start" font-weight="bold">JevBench public</text><text x="608" y="145" font-size="10" fill="#59636e" text-anchor="start" font-weight="normal">direct 0.779 → 항상 0.892</text><rect x="590" y="160" width="12" height="12" fill="#ea580c"/><text x="608" y="170" font-size="11" fill="#1f2328" text-anchor="start" font-weight="bold">hard-v1</text><text x="608" y="185" font-size="10" fill="#59636e" text-anchor="start" font-weight="normal">direct 0.812 → 항상 0.958</text><rect x="590" y="200" width="12" height="12" fill="#16a34a"/><text x="608" y="210" font-size="11" fill="#1f2328" text-anchor="start" font-weight="bold">transfer-v4</text><text x="608" y="225" font-size="10" fill="#59636e" text-anchor="start" font-weight="normal">direct 0.803 → 항상 0.861</text><text x="590" y="254" font-size="10" fill="#59636e" text-anchor="start" font-weight="normal">decision-v7 은 이득이 0.001 이라 제외</text><text x="590" y="268" font-size="10" fill="#59636e" text-anchor="start" font-weight="normal">hard-v1 은 문턱 0.9 가 항상보다 높다</text><text x="20" y="456" font-size="11" fill="#59636e" text-anchor="start" font-weight="normal">점선 위에 있으면 비용보다 많은 이득을 회수한 것이다. 문턱 0.5 에서는 yes/no 질문이 걸리지 않는다 (top 확률이 0.5 미만일 수 없음, 카드).</text><text x="792" y="474" font-size="9" fill="#8b949e" text-anchor="end">생성: python scripts/figures/trida_figures.py · 손으로 고치지 말 것</text></svg>