<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 278" width="800" height="278" role="img" aria-label="auto-ontology-mcp 도구 그룹과 도구 정의 크기" style="max-width:100%;height:auto;font-family:-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><title>auto-ontology-mcp 도구 그룹과 도구 정의 크기</title><rect width="800" height="278" fill="#ffffff"/><text x="20" y="28" font-size="15" fill="#1f2328" text-anchor="start" font-weight="bold">도구 35개를 4개 그룹으로 나누고, 질의만 하는 클라이언트는 answer 13개만 받는다</text><text x="20" y="46" font-size="11" fill="#59636e" text-anchor="start" font-weight="normal">server.py TOOL_GROUPS 를 센 값과 README 의 도구 정의 문자 수(근사값). 도구 정의는 클라이언트가 요청마다 보낸다</text><text x="20" y="90" font-size="12" fill="#1f2328" text-anchor="start" font-weight="bold">그룹별 도구 수 (합 35)</text><rect x="200.0" y="76" width="200.6" height="22" fill="#2563eb" opacity="0.85"/><text x="300.2857142857143" y="91" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">13</text><rect x="400.6" y="76" width="154.3" height="22" fill="#16a34a" opacity="0.85"/><text x="477.71428571428567" y="91" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">10</text><rect x="554.9" y="76" width="154.3" height="22" fill="#ea580c" opacity="0.85"/><text x="632.0" y="91" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">10</text><rect x="709.1" y="76" width="30.9" height="22" fill="#9333ea" opacity="0.85"/><text x="724.5714285714286" y="91" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">2</text><rect x="200" y="108" width="12" height="12" rx="2" fill="#2563eb"/><text x="218" y="118" font-size="11" fill="#59636e" text-anchor="start" font-weight="normal">answer (항상 켜짐)</text><rect x="352" y="108" width="12" height="12" rx="2" fill="#16a34a"/><text x="370" y="118" font-size="11" fill="#59636e" text-anchor="start" font-weight="normal">model</text><rect x="432" y="108" width="12" height="12" rx="2" fill="#ea580c"/><text x="450" y="118" font-size="11" fill="#59636e" text-anchor="start" font-weight="normal">knowledge</text><rect x="544" y="108" width="12" height="12" rx="2" fill="#9333ea"/><text x="562" y="118" font-size="11" fill="#59636e" text-anchor="start" font-weight="normal">share</text><text x="20" y="152" font-size="12" fill="#1f2328" text-anchor="start" font-weight="bold">도구 정의 문자 수</text><text x="190" y="181" font-size="11" fill="#1f2328" text-anchor="end" font-weight="normal">전체 도구 (all)</text><rect x="200" y="166" width="440.0" height="22" fill="#8b949e" opacity="0.85"/><text x="646.0" y="181" font-size="11" fill="#1f2328" text-anchor="start" font-weight="bold">약 52,000자</text><text x="190" y="213" font-size="11" fill="#1f2328" text-anchor="end" font-weight="normal">answer 만</text><rect x="200" y="198" width="101.5" height="22" fill="#2563eb" opacity="0.85"/><text x="307.53846153846155" y="213" font-size="11" fill="#1f2328" text-anchor="start" font-weight="bold">약 12,000자</text><text x="20" y="252" font-size="11" fill="#59636e" text-anchor="start" font-weight="normal">answer 만 켜면 정의가 약 23% 로 준다. 모델링 · 지식 저장 단계의 handshake 지시문도 함께 빠진다</text><text x="792" y="272" font-size="9" fill="#8b949e" text-anchor="end">생성: python scripts/figures/aomcp_figures.py · 손으로 고치지 말 것</text></svg>