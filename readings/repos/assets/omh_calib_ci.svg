<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" width="820" height="360" role="img" aria-label="oh-my-hermes 보정 프롬프트 토큰 차이 CI" style="max-width:100%;height:auto;font-family:-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><title>oh-my-hermes 보정 프롬프트 토큰 차이 CI</title><rect width="820" height="360" fill="#ffffff"/><text x="20" y="28" font-size="15" fill="#1f2328" text-anchor="start" font-weight="bold">모델별 보정 프롬프트 4-arm: 통과는 모두 18/30, 토큰 차이만 남는다</text><text x="20" y="46" font-size="12" fill="#59636e" text-anchor="start" font-weight="normal">gpt-6-astra xhigh, 문항별 paired bootstrap 10,000회. 점 = 평균 Δ 토큰, 선 = CI95. 0을 걸치면 차이 판단 불가</text><line x1="200.0" y1="70" x2="200.0" y2="280" stroke="#d8dee4"/><text x="200.0" y="64" font-size="10" fill="#59636e" text-anchor="middle" font-weight="normal">-10,000</text><line x1="338.1" y1="70" x2="338.1" y2="280" stroke="#d8dee4"/><text x="338.0952380952381" y="64" font-size="10" fill="#59636e" text-anchor="middle" font-weight="normal">-5,000</text><line x1="476.2" y1="70" x2="476.2" y2="280" stroke="#8b949e"/><text x="476.19047619047615" y="64" font-size="10" fill="#59636e" text-anchor="middle" font-weight="normal">0</text><line x1="614.3" y1="70" x2="614.3" y2="280" stroke="#d8dee4"/><text x="614.2857142857142" y="64" font-size="10" fill="#59636e" text-anchor="middle" font-weight="normal">+5,000</text><line x1="752.4" y1="70" x2="752.4" y2="280" stroke="#d8dee4"/><text x="752.3809523809523" y="64" font-size="10" fill="#59636e" text-anchor="middle" font-weight="normal">+10,000</text><text x="188" y="104.0" font-size="12" fill="#1f2328" text-anchor="end" font-weight="normal">family − baseline</text><line x1="372.3" y1="100.0" x2="512.1" y2="100.0" stroke="#8b949e" stroke-width="3"/><circle cx="441.6" cy="100.0" r="6" fill="#8b949e"/><text x="520.0952380952381" y="104.0" font-size="11" fill="#59636e" text-anchor="start" font-weight="normal">-1,251</text><text x="188" y="144.0" font-size="12" fill="#1f2328" text-anchor="end" font-weight="normal">optimized − baseline</text><line x1="467.2" y1="140.0" x2="727.5" y2="140.0" stroke="#8b949e" stroke-width="3"/><circle cx="591.3" cy="140.0" r="6" fill="#8b949e"/><text x="735.5238095238095" y="144.0" font-size="11" fill="#59636e" text-anchor="start" font-weight="normal">+4,168</text><text x="188" y="184.0" font-size="12" fill="#1f2328" text-anchor="end" font-weight="bold">optimized − family</text><line x1="516.1" y1="180.0" x2="756.5" y2="180.0" stroke="#dc2626" stroke-width="3"/><circle cx="625.9" cy="180.0" r="6" fill="#dc2626"/><text x="764.5238095238095" y="184.0" font-size="11" fill="#59636e" text-anchor="start" font-weight="normal">+5,419</text><text x="188" y="224.0" font-size="12" fill="#1f2328" text-anchor="end" font-weight="normal">revised − family</text><line x1="445.6" y1="220.0" x2="543.7" y2="220.0" stroke="#8b949e" stroke-width="3"/><circle cx="493.6" cy="220.0" r="6" fill="#8b949e"/><text x="551.7190476190476" y="224.0" font-size="11" fill="#59636e" text-anchor="start" font-weight="normal">+629</text><text x="188" y="264.0" font-size="12" fill="#1f2328" text-anchor="end" font-weight="bold">revised − optimized</text><line x1="218.3" y1="260.0" x2="446.5" y2="260.0" stroke="#16a34a" stroke-width="3"/><circle cx="343.9" cy="260.0" r="6" fill="#16a34a"/><text x="454.5" y="264.0" font-size="11" fill="#59636e" text-anchor="start" font-weight="normal">-4,790</text><text x="20" y="306" font-size="11" fill="#59636e" text-anchor="start" font-weight="normal">빨강 = 확실히 더 씀, 초록 = 확실히 덜 씀, 회색 = CI 가 0을 걸침</text><text x="20" y="324" font-size="11" fill="#59636e" text-anchor="start" font-weight="normal">원래 override 가 family 보다 더 썼고(빨강), 고친 revised 가 그 차이를 되돌렸다(초록). revised 와 family 는 구분되지 않는다</text><text x="812" y="354" font-size="9" fill="#8b949e" text-anchor="end">생성: python scripts/figures/omh_figures.py · 손으로 고치지 말 것</text></svg>