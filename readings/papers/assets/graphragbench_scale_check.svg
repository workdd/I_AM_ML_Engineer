<text x="60.0" y="326.0" text-anchor="start" class="t2" style="font-size:12.5px">Table 17의 RAG 56k 값(64.73 · 58.64 · 65.75 · 60.61)은 의료 데이터셋 Table 9 값과 네 자리 모두 같습니다.</text>
<text x="60.0" y="346.0" text-anchor="start" class="t2" style="font-size:12.5px">빈 원(소설 Table 9 값)으로 바꾸면 복합 추론의 RAG는 42.93 → 41.33 → 43.20으로 거의 평평합니다.</text>
