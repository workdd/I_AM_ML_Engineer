<svg xmlns="http://www.w3.org/2000/svg" width="860" height="400" viewBox="0 0 860 400" role="img" aria-label="상쇄: 새 오차가 물려받은 오차의 반대쪽을 향한다">
<title>상쇄: 새 오차가 물려받은 오차의 반대쪽을 향한다</title>
<style>
svg{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#8a8984;--grid:#e6e5e1;--rule:#c9c8c3;--s1:#2a78d6;--s2:#eb6834;--faint:#d9d8d3}
@media (prefers-color-scheme:dark){svg{--surface:#1a1a19;--ink:#ffffff;--ink2:#c3c2b7;--muted:#8f8e88;--grid:#343431;--rule:#4a4945;--s1:#3987e5;--s2:#d95926;--faint:#4a4945}}
text{font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:var(--ink);font-size:13px}
.bg{fill:var(--surface)} .t2{fill:var(--ink2)} .mu{fill:var(--muted);font-size:11px}
.ttl{font-size:16px;font-weight:700} .sub{fill:var(--ink2);font-size:12.5px}
.grid{stroke:var(--grid);stroke-width:1} .rule{stroke:var(--rule);stroke-width:1}
.s1f{fill:var(--s1)} .s2f{fill:var(--s2)} .s1s{stroke:var(--s1)} .s2s{stroke:var(--s2)}
.ring{stroke:var(--surface);stroke-width:2} .ref{stroke:var(--ink2);stroke-width:1.5}
.faintf{fill:var(--faint)} .fainte{stroke:var(--faint)} .inkS{stroke:var(--ink2)}
.b{font-weight:700}
</style>
<rect class="bg" x="0" y="0" width="860" height="400" rx="10"/>
<text x="24.0" y="34.0" text-anchor="start" class="ttl">상쇄: 새 오차가 물려받은 오차의 반대쪽을 향한다</text>
<text x="24.0" y="55.0" text-anchor="start" class="sub">같은 크기의 새 오차라도 방향에 따라 누적 오차가 달라진다. 길이는 예시 값, 식은 Prop. 1</text>
<defs><marker id="m0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--s1)"/></marker><marker id="k0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--ink2)"/></marker></defs>
<text x="60.0" y="96.0" text-anchor="start" class="b" style="font-size:13.5px">상쇄 (cos = −0.25)</text>
<line x1="60" y1="300" x2="180.0" y2="300.0" style="stroke:var(--ink2);stroke-width:2" marker-end="url(#k0)"/>
<text x="120.0" y="320.0" text-anchor="middle" class="t2" style="font-size:11.5px">Δh⁽ℓ⁻¹⁾ 물려받은 오차</text>
<line x1="180.0" y1="300.0" x2="156.0" y2="207.0" style="stroke:var(--s1);stroke-width:2" marker-end="url(#m0)"/>
<text x="162.0" y="203.0" text-anchor="start" class="t2" style="font-size:11.5px">Δu⁽ℓ⁾ 새 오차</text>
<line x1="60" y1="300" x2="156.0" y2="207.0" style="stroke:var(--s1);stroke-width:3;opacity:.85" marker-end="url(#m0)"/>
<text x="60.0" y="128.0" text-anchor="start" class="b" style="font-size:13px">합친 오차 길이 1.11</text>
<text x="60.0" y="146.0" text-anchor="start" class="mu">(상쇄 없을 때 1.28 대비 87%)</text>
<defs><marker id="m1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--muted)"/></marker><marker id="k1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--ink2)"/></marker></defs>
<text x="330.0" y="96.0" text-anchor="start" class="b" style="font-size:13.5px">상쇄 없음 (cos = 0)</text>
<line x1="330" y1="300" x2="450.0" y2="300.0" style="stroke:var(--ink2);stroke-width:2" marker-end="url(#k1)"/>
<text x="390.0" y="320.0" text-anchor="middle" class="t2" style="font-size:11.5px">Δh⁽ℓ⁻¹⁾ 물려받은 오차</text>
<line x1="450.0" y1="300.0" x2="450.0" y2="204.0" style="stroke:var(--muted);stroke-width:2" marker-end="url(#m1)"/>
<text x="456.0" y="200.0" text-anchor="start" class="t2" style="font-size:11.5px">Δu⁽ℓ⁾ 새 오차</text>
<line x1="330" y1="300" x2="450.0" y2="204.0" style="stroke:var(--muted);stroke-width:3;opacity:.85" marker-end="url(#m1)"/>
<text x="330.0" y="128.0" text-anchor="start" class="t2" style="font-size:13px">합친 오차 길이 1.28</text>
<text x="330.0" y="146.0" text-anchor="start" class="mu">(상쇄 없을 때 1.28 대비 100%)</text>
<defs><marker id="m2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--s2)"/></marker><marker id="k2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--ink2)"/></marker></defs>
<text x="600.0" y="96.0" text-anchor="start" class="b" style="font-size:13.5px">같은 방향 (cos = +0.5)</text>
<line x1="600" y1="300" x2="720.0" y2="300.0" style="stroke:var(--ink2);stroke-width:2" marker-end="url(#k2)"/>
<text x="660.0" y="320.0" text-anchor="middle" class="t2" style="font-size:11.5px">Δh⁽ℓ⁻¹⁾ 물려받은 오차</text>
<line x1="720.0" y1="300.0" x2="768.0" y2="216.9" style="stroke:var(--s2);stroke-width:2" marker-end="url(#m2)"/>
<text x="774.0" y="212.9" text-anchor="start" class="t2" style="font-size:11.5px">Δu⁽ℓ⁾ 새 오차</text>
<line x1="600" y1="300" x2="768.0" y2="216.9" style="stroke:var(--s2);stroke-width:3;opacity:.85" marker-end="url(#m2)"/>
<text x="600.0" y="128.0" text-anchor="start" class="t2" style="font-size:13px">합친 오차 길이 1.56</text>
<text x="600.0" y="146.0" text-anchor="start" class="mu">(상쇄 없을 때 1.28 대비 122%)</text>
<text x="24.0" y="352.0" text-anchor="start" class="t2" style="font-size:12.5px">‖Δh⁽ℓ⁾‖² = ‖Δh⁽ℓ⁻¹⁾‖² + ‖Δu⁽ℓ⁾‖² + 2⟨Δh⁽ℓ⁻¹⁾, Δu⁽ℓ⁾⟩. 마지막 항이 음수면 새 오차가 물려받은 오차를 일부 지운다.</text>
<text x="24.0" y="374.0" text-anchor="start" class="mu">출처: Why Does Post-Training Quantization Work? (arXiv:2609.11716) Prop. 1. 벡터 길이는 설명용 예시</text>
<text x="24.0" y="389.0" text-anchor="start" class="mu">생성: python scripts/figures/ptq_figures.py · 손으로 고치지 말 것</text>
</svg>
