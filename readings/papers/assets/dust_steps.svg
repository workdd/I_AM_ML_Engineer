<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 428" width="760" height="428" role="img" aria-label="Dust 업데이트 단계" style="max-width:100%;height:auto;font-family:-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><title>Dust 업데이트 단계</title><rect width="760" height="428" fill="#ffffff"/><text x="20" y="28" font-size="15" fill="#1f2328" text-anchor="start" font-weight="bold">Dust 한 번의 업데이트 (3~6 단계를 층 종류·블록별로 K번 반복)</text><circle cx="38" cy="62" r="14" fill="#0f766e"/><text x="38" y="67" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">1</text><rect x="62" y="44" width="678" height="36" rx="6" fill="#f6f8fa" stroke="#d8dee4"/><text x="76" y="67" font-size="13" fill="#0f766e" text-anchor="start" font-weight="bold">clean 순전파</text><text x="220" y="67" font-size="12.5" fill="#1f2328" text-anchor="start" font-weight="normal">잡음 없이 1회, 활성값 캐시</text><line x1="38" y1="76" x2="38" y2="94" stroke="#d8dee4" stroke-width="2"/><circle cx="38" cy="108" r="14" fill="#0f766e"/><text x="38" y="113" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">2</text><rect x="62" y="90" width="678" height="36" rx="6" fill="#f6f8fa" stroke="#d8dee4"/><text x="76" y="113" font-size="13" fill="#0f766e" text-anchor="start" font-weight="bold">잡음 넣기</text><text x="220" y="113" font-size="12.5" fill="#1f2328" text-anchor="start" font-weight="normal">층 출력 y → y + σa, 토큰마다 독립 a ~ N(0, I)</text><line x1="38" y1="122" x2="38" y2="140" stroke="#d8dee4" stroke-width="2"/><circle cx="38" cy="154" r="14" fill="#7c3aed"/><text x="38" y="159" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">3</text><rect x="62" y="136" width="678" height="36" rx="6" fill="#f6f8fa" stroke="#d8dee4"/><text x="76" y="159" font-size="13" fill="#7c3aed" text-anchor="start" font-weight="bold">부분 순전파</text><text x="220" y="159" font-size="12.5" fill="#1f2328" text-anchor="start" font-weight="normal">블록 l 의 draw 는 블록 l 부터만 재계산</text><line x1="38" y1="168" x2="38" y2="186" stroke="#d8dee4" stroke-width="2"/><circle cx="38" cy="200" r="14" fill="#7c3aed"/><text x="38" y="205" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">4</text><rect x="62" y="182" width="678" height="36" rx="6" fill="#f6f8fa" stroke="#d8dee4"/><text x="76" y="205" font-size="13" fill="#7c3aed" text-anchor="start" font-weight="bold">토큰별 손실 감소</text><text x="220" y="205" font-size="12.5" fill="#1f2328" text-anchor="start" font-weight="normal">c_s = (draw 평균 손실) - (이 draw 손실)</text><line x1="38" y1="214" x2="38" y2="232" stroke="#d8dee4" stroke-width="2"/><circle cx="38" cy="246" r="14" fill="#7c3aed"/><text x="38" y="251" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">5</text><rect x="62" y="228" width="678" height="36" rx="6" fill="#f6f8fa" stroke="#d8dee4"/><text x="76" y="251" font-size="13" fill="#7c3aed" text-anchor="start" font-weight="bold">보상</text><text x="220" y="251" font-size="12.5" fill="#1f2328" text-anchor="start" font-weight="normal">r_t = Σ_{s≥t} γ^(s-t) c_s</text><line x1="38" y1="260" x2="38" y2="278" stroke="#d8dee4" stroke-width="2"/><circle cx="38" cy="292" r="14" fill="#7c3aed"/><text x="38" y="297" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">6</text><rect x="62" y="274" width="678" height="36" rx="6" fill="#f6f8fa" stroke="#d8dee4"/><text x="76" y="297" font-size="13" fill="#7c3aed" text-anchor="start" font-weight="bold">출력 오차 추정</text><text x="220" y="297" font-size="12.5" fill="#1f2328" text-anchor="start" font-weight="normal">ĝ_t = -(1/Kσ) Σ_i r_t a_t</text><line x1="38" y1="306" x2="38" y2="324" stroke="#d8dee4" stroke-width="2"/><circle cx="38" cy="338" r="14" fill="#0f766e"/><text x="38" y="343" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">7</text><rect x="62" y="320" width="678" height="36" rx="6" fill="#f6f8fa" stroke="#d8dee4"/><text x="76" y="343" font-size="13" fill="#0f766e" text-anchor="start" font-weight="bold">가중치 기울기</text><text x="220" y="343" font-size="12.5" fill="#1f2328" text-anchor="start" font-weight="normal">Ĝ_W = Σ_t ĝ_t x_tᵀ</text><line x1="38" y1="352" x2="38" y2="370" stroke="#d8dee4" stroke-width="2"/><circle cx="38" cy="384" r="14" fill="#0f766e"/><text x="38" y="389" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">8</text><rect x="62" y="366" width="678" height="36" rx="6" fill="#f6f8fa" stroke="#d8dee4"/><text x="76" y="389" font-size="13" fill="#0f766e" text-anchor="start" font-weight="bold">업데이트</text><text x="220" y="389" font-size="12.5" fill="#1f2328" text-anchor="start" font-weight="normal">모멘텀 SGD 또는 Adam</text><text x="752" y="422" font-size="9" fill="#8b949e" text-anchor="end">생성: python scripts/figures/dust_figures.py · 손으로 고치지 말 것</text></svg>