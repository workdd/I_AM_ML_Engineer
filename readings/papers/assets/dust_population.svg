<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-label="가상 집단" style="max-width:100%;height:auto;font-family:-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><title>가상 집단</title><rect width="760" height="330" fill="#ffffff"/><text x="20" y="28" font-size="15" fill="#1f2328" text-anchor="start" font-weight="bold">집단 구성원을 어디서 만드는가</text><text x="20" y="56" font-size="12.5" fill="#59636e" text-anchor="start" font-weight="normal">가중치 공간 ES (EGGROLL): 구성원 1개 = 섭동한 가중치 사본 1벌 = 배치 원소 1개</text><rect x="20" y="68" width="120" height="52" rx="8" fill="#f6f8fa" stroke="#8b949e" stroke-width="1.5"/><text x="80.0" y="90.7" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="normal">W + ε1</text><text x="80.0" y="105.7" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="normal">순전파 1회</text><rect x="160" y="68" width="120" height="52" rx="8" fill="#f6f8fa" stroke="#8b949e" stroke-width="1.5"/><text x="220.0" y="90.7" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="normal">W + ε2</text><text x="220.0" y="105.7" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="normal">순전파 1회</text><rect x="300" y="68" width="120" height="52" rx="8" fill="#f6f8fa" stroke="#8b949e" stroke-width="1.5"/><text x="360.0" y="90.7" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="normal">W + ε3</text><text x="360.0" y="105.7" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="normal">순전파 1회</text><rect x="440" y="68" width="120" height="52" rx="8" fill="#f6f8fa" stroke="#8b949e" stroke-width="1.5"/><text x="500.0" y="90.7" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="normal">…</text><text x="500.0" y="105.7" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="normal"></text><text x="600" y="100" font-size="13" fill="#8b949e" text-anchor="start" font-weight="bold">구성원 수 ≈ 순전파 수</text><text x="20" y="160" font-size="12.5" fill="#59636e" text-anchor="start" font-weight="normal">Dust: 구성원 1개 = 토큰 1개의 활성값 잡음. 가중치는 한 벌</text><rect x="20" y="172" width="720" height="40" rx="6" fill="#f5f0ff" stroke="#7c3aed"/><text x="380" y="197" font-size="12.5" fill="#7c3aed" text-anchor="middle" font-weight="bold">층 출력 활성값 (시퀀스 2,048 토큰)</text><rect x="24" y="224" width="37" height="30" rx="4" fill="#ffffff" stroke="#7c3aed"/><text x="42" y="244" font-size="11" fill="#7c3aed" text-anchor="middle" font-weight="normal">a1</text><rect x="69" y="224" width="37" height="30" rx="4" fill="#ffffff" stroke="#7c3aed"/><text x="87" y="244" font-size="11" fill="#7c3aed" text-anchor="middle" font-weight="normal">a2</text><rect x="114" y="224" width="37" height="30" rx="4" fill="#ffffff" stroke="#7c3aed"/><text x="132" y="244" font-size="11" fill="#7c3aed" text-anchor="middle" font-weight="normal">a3</text><rect x="159" y="224" width="37" height="30" rx="4" fill="#ffffff" stroke="#7c3aed"/><text x="177" y="244" font-size="11" fill="#7c3aed" text-anchor="middle" font-weight="normal">a4</text><rect x="204" y="224" width="37" height="30" rx="4" fill="#ffffff" stroke="#7c3aed"/><text x="222" y="244" font-size="11" fill="#7c3aed" text-anchor="middle" font-weight="normal">a5</text><rect x="249" y="224" width="37" height="30" rx="4" fill="#ffffff" stroke="#7c3aed"/><text x="267" y="244" font-size="11" fill="#7c3aed" text-anchor="middle" font-weight="normal">a6</text><rect x="294" y="224" width="37" height="30" rx="4" fill="#ffffff" stroke="#7c3aed"/><text x="312" y="244" font-size="11" fill="#7c3aed" text-anchor="middle" font-weight="normal">a7</text><rect x="339" y="224" width="37" height="30" rx="4" fill="#ffffff" stroke="#7c3aed"/><text x="357" y="244" font-size="11" fill="#7c3aed" text-anchor="middle" font-weight="normal">a8</text><rect x="384" y="224" width="37" height="30" rx="4" fill="#ffffff" stroke="#7c3aed"/><text x="402" y="244" font-size="11" fill="#7c3aed" text-anchor="middle" font-weight="normal">a9</text><rect x=