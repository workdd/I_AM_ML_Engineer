<text x="158.5" y="150.5" text-anchor="start" class="b" style="font-size:11.5px">RAG (rerank 없음) · 916</text>
<text x="523.0" y="186.2" text-anchor="start" class="t2" style="font-size:11.5px">MS-GraphRAG local · 39,264</text>
<text x="710.1" y="279.0" text-anchor="end" class="t2" style="font-size:11.5px">MS-GraphRAG global · 332,128</text>
