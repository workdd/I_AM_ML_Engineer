<text x="24.0" y="78.0" text-anchor="start" class="t2" style="font-size:12px">HippoRAG2(파랑)는 RAG(주황)와 같은 1천 토큰대에서 가장 높다. 수만~수십만 토큰을 쓰는 방식은 RAG와 비슷하거나 낮다</text>
<text x="24.0" y="414.0" text-anchor="start" class="mu">출처: GraphRAG-Bench (arXiv:2506.05690) Table 6, 7, 9에서 계산</text>
<text x="24.0" y="429.0" text-anchor="start" class="mu">생성: python scripts/figures/graphrag_figures.py · 손으로 고치지 말 것</text>
</svg>
