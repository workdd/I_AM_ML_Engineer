<text x="425.0" y="390.0" text-anchor="middle" class="t2" style="font-size:12px">질의당 평균 프롬프트 토큰 (로그 눈금, 두 데이터셋 평균)</text>
<text x="40" y="225.0" text-anchor="middle" class="t2" style="font-size:12px" transform="rotate(-90 40 225.0)">평균 ACC (2개 데이터셋 × 4개 과제)</text>
<circle class="s2f ring" cx="148.5" cy="158.5" r="6"><title>RAG (rerank 없음) 916 토큰, ACC 54.5</title></circle>
<circle class="ring" style="fill:var(--muted)" cx="513.0" cy="194.2" r="6"><title>MS-GraphRAG local 39,264 토큰, ACC 48.0</title></circle>
<circle class="ring" style="fill:var(--muted)" cx="720.1" cy="287.0" r="6"><title>MS-GraphRAG global 332,128 토큰, ACC 31.3</title></circle>
