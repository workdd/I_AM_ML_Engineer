<text x="594.8" y="112.0" text-anchor="start" class="b">16,728</text>
<text x="646.8" y="112.0" text-anchor="start" class="t2" style="font-size:12px">기준</text>
<text x="138.0" y="155.0" text-anchor="end">PathRAG-lt</text>
