<svg xmlns="http://www.w3.org/2000/svg" width="860" height="570" viewBox="0 0 860 570" role="img" aria-label="흐름 전파 예시: 짧은 경로보다 갈림 없는 경로">
<title>흐름 전파 예시: 짧은 경로보다 갈림 없는 경로</title>
<style>
svg{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#8a8984;--grid:#e6e5e1;--rule:#c9c8c3;--s1:#2a78d6;--s2:#eb6834;--faint:#d9d8d3}
@media (prefers-color-scheme:dark){svg{--surface:#1a1a19;--ink:#ffffff;--ink2:#c3c2b7;--muted:#8f8e88;--grid:#343431;--rule:#4a4945;--s1:#3987e5;--s2:#d95926;--faint:#4a4945}}
text{font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:var(--ink);font-size:13px}
.bg{fill:var(--surface)} .t2{fill:var(--ink2)} .mu{fill:var(--muted);font-size:11px}
.ttl{font-size:16px;font-weight:700} .sub{fill:var(--ink2);font-size:12.5px}
.grid{stroke:var(--grid);stroke-width:1} .rule{stroke:var(--rule);stroke-width:1}
.s1f{fill:var(--s1)} .s2f{fill:var(--s2)} .s1s{stroke:var(--s1)} .s2s{stroke:var(--s2)}
.ring{stroke:var(--surface);stroke-width:2} .ref{stroke:var(--ink2);stroke-width:1.5}
.faintf{fill:var(--faint)} .fainte{stroke:var(--faint)} .inkS{stroke:var(--ink2)}
.b{font-weight:700}
</style>
<rect class="bg" x="0" y="0" width="860" height="570" rx="10"/>
<text x="24.0" y="34.0" text-anchor="start" class="ttl">흐름 전파 예시: 짧은 경로보다 갈림 없는 경로</text>
<text x="24.0" y="55.0" text-anchor="start" class="sub">PathRAG 공개 코드(operate.py)의 경로 점수 계산을 그대로 옮겨 계산한 값</text>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--ink2)"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--s1)"/></marker></defs>
<line class="inkS" x1="110.1" y1="291.0" x2="267.2" y2="220.3" style="stroke-width:1.6" marker-end="url(#ar)"/>
