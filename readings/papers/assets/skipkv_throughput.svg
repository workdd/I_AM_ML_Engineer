.0" cy="116.8" r="3.2" fill="#2563eb"/><circle cx="395.0" cy="160.0" r="3.2" fill="#2563eb"/><circle cx="500.0" cy="164.8" r="3.2" fill="#2563eb"/><text x="508.0" y="156.8" font-size="11.5" fill="#2563eb" text-anchor="start" font-weight="bold">SkipKV</text><text x="595" y="120" font-size="11.5" fill="#1f2328" text-anchor="start" font-weight="bold">논문의 9.6배</text><text x="595" y="138" font-size="11" fill="#59636e" text-anchor="start" font-weight="normal">25.4 ÷ 2.64</text><text x="595" y="154" font-size="11" fill="#59636e" text-anchor="start" font-weight="normal">(FullKV 배치 50)</text><text x="595" y="190" font-size="11.5" fill="#1f2328" text-anchor="start" font-weight="bold">각자 최고점끼리</text><text x="595" y="208" font-size="11" fill="#59636e" text-anchor="start" font-weight="normal">25.4 ÷ 4.07</text><text x="595" y="224" font-size="11" fill="#59636e" text-anchor="start" font-weight="normal">≈ 6.2배</text><text x="20" y="396" font-size="11" fill="#59636e" text-anchor="start" font-weight="normal">같은 배치 10에서 SkipKV ÷ R-KV = 9.70 ÷ 5.81 ≈ 1.7배 (논문의 "최대 1.7배")</text><text x="692" y="414" font-size="9" fill="#8b949e" text-anchor="end">생성: python scripts/figures/skipkv_figures.py · 손으로 고치지 말 것</text></svg>