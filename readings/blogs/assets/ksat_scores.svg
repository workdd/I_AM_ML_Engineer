<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-label="2027 수능 수학 체크포인트별 평균과 다수결 점수" style="max-width:100%;height:auto;font-family:-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><title>2027 수능 수학 체크포인트별 평균과 다수결 점수</title><rect width="720" height="420" fill="#ffffff"/><text x="20" y="28" font-size="15" fill="#1f2328" text-anchor="start" font-weight="bold">평균은 세 모델 모두 오르지만 다수결 만점은 1차 RL 체크포인트뿐이다</text><text x="20" y="46" font-size="12" fill="#59636e" text-anchor="start" font-weight="normal">2027학년도 수능 수학, 문항당 16회 생성. 막대 = 16회 평균, 점 = 문항별 다수결 점수 (30문항 100점 만점)</text><rect x="20" y="62" width="12" height="12" rx="2" fill="#8b949e"/><text x="38" y="72" font-size="12" fill="#1f2328" text-anchor="start" font-weight="normal">원본 (Nanbeige4.2-3B)</text><rect x="219" y="62" width="12" height="12" rx="2" fill="#2563eb"/><text x="237" y="72" font-size="12" fill="#1f2328" text-anchor="start" font-weight="normal">1차 RL step 40</text><rect x="364" y="62" width="12" height="12" rx="2" fill="#93c5fd"/><text x="382" y="72" font-size="12" fill="#1f2328" text-anchor="start" font-weight="normal">2차 RL step 10 (공개 모델)</text><circle cx="587" cy="68" r="5" fill="#ffffff" stroke="#1f2328" stroke-width="2"/><text x="597" y="72" font-size="12" fill="#1f2328" text-anchor="start" font-weight="normal">다수결</text><line x1="60" y1="320.0" x2="700" y2="320.0" stroke="#d8dee4"/><text x="52" y="324.0" font-size="11" fill="#59636e" text-anchor="end" font-weight="normal">90</text><line x1="60" y1="275.2" x2="700" y2="275.2" stroke="#d8dee4"/><text x="52" y="279.2" font-size="11" fill="#59636e" text-anchor="end" font-weight="normal">92</text><line x1="60" y1="230.4" x2="700" y2="230.4" stroke="#d8dee4"/><text x="52" y="234.4" font-size="11" fill="#59636e" text-anchor="end" font-weight="normal">94</text><line x1="60" y1="185.6" x2="700" y2="185.6" stroke="#d8dee4"/><text x="52" y="189.6" font-size="11" fill="#59636e" text-anchor="end" font-weight="normal">96</text><line x1="60" y1="140.8" x2="700" y2="140.8" stroke="#d8dee4"/><text x="52" y="144.8" font-size="11" fill="#59636e" text-anchor="end" font-weight="normal">98</text><line x1="60" y1="96.0" x2="700" y2="96.0" stroke="#d8dee4"/><text x="52" y="100.0" font-size="11" fill="#59636e" text-anchor="end" font-weight="normal">100</text><text x="52" y="336" font-size="10" fill="#59636e" text-anchor="end" font-weight="normal">(90부터)</text><rect x="85.6" y="230.4" width="46.93333333333334" height="89.6" rx="3" fill="#8b949e"/><text x="109.06666666666666" y="312" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">94.0</text><circle cx="109.06666666666666" cy="185.6" r="6" fill="#ffffff" stroke="#1f2328" stroke-width="2"/><text x="109.06666666666666" y="175.6" font-size="11" fill="#1f2328" text-anchor="middle" font-weight="bold">96</text><rect x="138.53333333333333" y="167.68000000000006" width="46.93333333333334" height="152.31999999999994" rx="3" fill="#2563eb"/><text x="162.0" y="312" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">96.8</text><circle cx="162.0" cy="96.0" r="6" fill="#ffffff" stroke="#1f2328" stroke-width="2"/><text x="162.0" y="86.0" font-size="11" fill="#1f2328" text-anchor="middle" font-weight="bold">100</text><rect x="191.46666666666667" y="196.8" width="46.93333333333334" height="123.19999999999999" rx="3" fill="#93c5fd"/><text x="214.93333333333334" y="312" font-size="11" fill="#1f2328" text-anchor="middle" font-weight="bold">95.5</text><circle cx="214.93333333333334" cy="185.6" r="6" fill="#ffffff" stroke="#1f2328" stroke-width="2"/><text x="214.93333333333334" y="175.6" font-size="11" fill="#1f2328" text-anchor="middle" font-weight="bold">96</text><text x="166.66666666666669" y="342" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="bold">확률과 통계</text><text x="166.66666666666669" y="360" font-size="11" fill="#2563eb" text-anchor="middle" font-weight="normal">1차 RL 단일 회차 10