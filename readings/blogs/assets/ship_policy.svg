<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" role="img" aria-label="approvals.yml 예시 규칙별 필요한 사람 승인 수" style="max-width:100%;height:auto;font-family:-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><title>approvals.yml 예시 규칙별 필요한 사람 승인 수</title><rect width="760" height="380" fill="#ffffff"/><text x="20" y="28" font-size="15" fill="#1f2328" text-anchor="start" font-weight="bold">같은 정책 파일 안에서 경로마다 Code Review 통과가 줄여 주는 사람 승인 수가 다르다</text><text x="20" y="46" font-size="12" fill="#59636e" text-anchor="start" font-weight="normal">발표 글의 .claude/approvals.yml 예시를 규칙별로 다시 셈. 칸 하나 = 필요한 사람 승인 1명</text><text x="30" y="82" font-size="12" fill="#59636e" text-anchor="start" font-weight="bold">규칙 (paths)</text><text x="300" y="82" font-size="12" fill="#59636e" text-anchor="start" font-weight="bold">기본 (Claude는 comments)</text><text x="520" y="82" font-size="12" fill="#59636e" text-anchor="start" font-weight="bold">claude/code_review = pass 일 때</text><line x1="20" y1="92" x2="740" y2="92" stroke="#d8dee4"/><text x="30" y="118" font-size="14" fill="#1f2328" text-anchor="start" font-weight="bold">Most code</text><text x="30" y="138" font-size="11" fill="#59636e" text-anchor="start" font-weight="normal">"**", "!docs/**"</text><rect x="300" y="104" width="26" height="26" rx="5" fill="#8b949e"/><rect x="334" y="104" width="26" height="26" rx="5" fill="#8b949e"/><text x="374" y="122" font-size="12" fill="#1f2328" text-anchor="start" font-weight="bold">2명</text><rect x="520" y="104" width="26" height="26" rx="5" fill="#2563eb"/><text x="560" y="122" font-size="12" fill="#2563eb" text-anchor="start" font-weight="bold">1명 + Claude approves</text><line x1="20" y1="172" x2="740" y2="172" stroke="#d8dee4"/><text x="30" y="198" font-size="14" fill="#1f2328" text-anchor="start" font-weight="bold">Docs</text><text x="30" y="218" font-size="11" fill="#59636e" text-anchor="start" font-weight="normal">"docs/**"</text><rect x="300" y="184" width="26" height="26" rx="5" fill="#8b949e"/><rect x="334" y="184" width="26" height="26" rx="5" fill="#8b949e"/><text x="374" y="202" font-size="12" fill="#1f2328" text-anchor="start" font-weight="bold">2명</text><rect x="520" y="184" width="26" height="26" rx="5" fill="none" stroke="#8b949e" stroke-dasharray="4 3"/><text x="556" y="202" font-size="12" fill="#16a34a" text-anchor="start" font-weight="bold">사람 승인 없이 Claude 승인으로 통과</text><text x="556" y="220" font-size="11" fill="#59636e" text-anchor="start" font-weight="normal">Claude approves</text><line x1="20" y1="252" x2="740" y2="252" stroke="#d8dee4"/><text x="30" y="278" font-size="14" fill="#1f2328" text-anchor="start" font-weight="bold">Billing</text><text x="30" y="298" font-size="11" fill="#59636e" text-anchor="start" font-weight="normal">"services/billing/**"</text><rect x="300" y="264" width="26" height="26" rx="5" fill="#8b949e"/><rect x="334" y="264" width="26" height="26" rx="5" fill="#8b949e"/><text x="374" y="282" font-size="12" fill="#1f2328" text-anchor="start" font-weight="bold">2명</text><rect x="520" y="264" width="26" height="26" rx="5" fill="#8b949e"/><rect x="554" y="264" width="26" height="26" rx="5" fill="#8b949e"/><text x="594" y="282" font-size="12" fill="#dc2626" text-anchor="start" font-weight="bold">override 없음, 그대로</text><text x="520" y="310" font-size="11" fill="#59636e" text-anchor="start" font-weight="normal">작성자가 아닌 2명, 그중 1명은 payments 팀</text><line x1="20" y1="332" x2="740" y2="332" stroke="#d8dee4"/><text x="20" y="356" font-size="11" fill="#59636e" text-anchor="start" font-weight="normal">Billing 의 payments 1명이 앞의 2명 안에 포함되는지는 원문 그림의 seats 목록 문법만으로 확정할 수 없다 (purpose 문장 기준 2명으로 셈)</text><text x="752" y="374" font-size="9" fill="#8b949e" text-anchor="end">생성: python scripts/figures/ship_figures.py, 손으로 고치지 말 것</text></svg>