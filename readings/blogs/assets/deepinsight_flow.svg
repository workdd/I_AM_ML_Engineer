<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 490" width="720" height="490" role="img" aria-label="Deep Insight 실행 흐름" style="max-width:100%;height:auto;font-family:-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><title>Deep Insight 실행 흐름</title><rect width="720" height="490" fill="#ffffff"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#59636e"/></marker></defs><text x="20" y="28" font-size="14.5" fill="#1f2328" text-anchor="start" font-weight="bold">Deep Insight 실행 흐름: 그래프로 고정한 앞단과 Supervisor가 도구로 부르는 뒷단</text><text x="20" y="46" font-size="11.5" fill="#59636e" text-anchor="start" font-weight="normal">위는 Strands Graph 노드와 조건부 엣지, 아래는 Supervisor 프롬프트가 강제하는 호출 순서와 각 단계의 산출 파일</text><rect x="20" y="90" width="145" height="50" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.8"/><text x="92.5" y="113.0" font-size="12.5" fill="#1f2328" text-anchor="middle" font-weight="bold">Coordinator</text><text x="92.5" y="128.0" font-size="10" fill="#59636e" text-anchor="middle" font-weight="normal">라우팅 (Haiku)</text><rect x="197" y="90" width="145" height="50" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.8"/><text x="269.5" y="113.0" font-size="12.5" fill="#1f2328" text-anchor="middle" font-weight="bold">Planner</text><text x="269.5" y="128.0" font-size="10" fill="#59636e" text-anchor="middle" font-weight="normal">체크리스트 계획 (Opus)</text><rect x="374" y="90" width="145" height="50" rx="6" fill="#ffffff" stroke="#ea580c" stroke-width="1.8"/><text x="446.5" y="113.0" font-size="12.5" fill="#1f2328" text-anchor="middle" font-weight="bold">Plan Reviewer</text><text x="446.5" y="128.0" font-size="10" fill="#59636e" text-anchor="middle" font-weight="normal">사람 검토 (HITL)</text><rect x="551" y="90" width="145" height="50" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.8"/><text x="623.5" y="113.0" font-size="12.5" fill="#1f2328" text-anchor="middle" font-weight="bold">Supervisor</text><text x="623.5" y="128.0" font-size="10" fill="#59636e" text-anchor="middle" font-weight="normal">오케스트레이션 (Sonnet)</text><line x1="165" y1="115.0" x2="195" y2="115.0" stroke="#59636e" stroke-width="1.5" marker-end="url(#a)"/><line x1="342" y1="115.0" x2="372" y2="115.0" stroke="#59636e" stroke-width="1.5" marker-end="url(#a)"/><path d="M446.5,140 C446.5,180 269.5,180 269.5,143" fill="none" stroke="#ea580c" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#a)"/><text x="358.0" y="184" font-size="10.5" fill="#ea580c" text-anchor="middle" font-weight="normal">수정 요청 (최대 10회, 기본값)</text><line x1="519" y1="115.0" x2="549" y2="115.0" stroke="#59636e" stroke-width="1.5" marker-end="url(#a)"/><text x="446.5" y="82" font-size="10.5" fill="#ea580c" text-anchor="middle" font-weight="normal">300초 무응답이면 자동 승인</text><text x="20" y="202" font-size="10.5" fill="#59636e" text-anchor="start" font-weight="normal">그래프 전체 노드 실행 상한 25회 (set_max_node_executions)</text><text x="20" y="226" font-size="12" fill="#1f2328" text-anchor="start" font-weight="bold">Supervisor의 필수 호출 순서 (agents-as-tools, 각 에이전트는 독립 context)</text><path d="M623.5,140 L623.5,250 L72.0,250 L72.0,269" fill="none" stroke="#59636e" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#a)"/><text x="615.5" y="244" font-size="10.5" fill="#59636e" text-anchor="end" font-weight="normal">도구 호출</text><rect x="20" y="272" width="104" height="46" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.8"/><text x="72.0" y="299.0" font-size="12.5" fill="#1f2328" text-anchor="middle" font-weight="bold">Coder</text><line x1="124" y1="295.0" x2="131" y2="295.0" stroke="#59636e" stroke-width="1.5" marker-end="url(#a)"/><text x="72.0" y="334" font-size="9.5" fill="#59636e" text-anchor="middle" font-weight="normal">*.png</text><text x="72.0" y="347" font-size="9.5" fill="#59636e" text-anchor="middle" font-weight="normal">all_results.txt</text><text x="72.0" y="360" font-size="9.5" fill="#59636e" text-anchor="middle" font-weight="normal">calculation_metadata.json</text><rect x="132" y="272" width="104" height="46" rx="6" fill="#ffffff" stroke="#8b949e" stroke-width="1.8"/><text x="184.0" y="299.0" font-size="12.5" fill="#1f2328" text-anchor="middle" font-weight="bold">Tracker</text><line x1="236" y1="295.0" x2="243" y2="295.0" stroke="#59636e" stroke-width="1.5" marker-end="url(#a)"/><text x="184.0" y="334" font-size="9.5" fill="#59636e" text-anchor="middle" font-weight="normal">full_plan [x] 갱신</text><rect x="244" y="272" width="104" height="46" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.8"/><text x="296.0" y="299.0" font-size="12.5" fill="#1f2328" text-anchor="middle" font-weight="bold">Validator</text><line x1="348" y1="295.0" x2="355" y2="295.0" stroke="#59636e" stroke-width="1.5" marker-end="url(#a)"/><text x="296.0" y="334" font-size="9.5" fill="#59636e" text-anchor="middle" font-weight="normal">citations.json</text><text x="296.0" y="347" font-size="9.5" fill="#59636e" text-anchor="middle" font-weight="normal">validation_report.txt</text><rect x="356" y="272" width="104" height="46" rx="6" fill="#ffffff" stroke="#8b949e" stroke-width="1.8"/><text x="408.0" y="299.0" font-size="12.5" fill="#1f2328" text-anchor="middle" font-weight="bold">Tracker</text><line x1="460" y1="295.0" x2="467" y2="295.0" stroke="#59636e" stroke-width="1.5" marker-end="url(#a)"/><text x="408.0" y="334" font-size="9.5" fill="#59636e" text-anchor="middle" font-weight="normal">full_plan [x] 갱신</text><rect x="468" y="272" width="104" height="46" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.8"/><text x="520.0" y="299.0" font-size="12.5" fill="#1f2328" text-anchor="middle" font-weight="bold">Reporter</text><line x1="572" y1="295.0" x2="579" y2="295.0" stroke="#59636e" stroke-width="1.5" marker-end="url(#a)"/><text x="520.0" y="334" font-size="9.5" fill="#59636e" text-anchor="middle" font-weight="normal">final_report(_with_citations).docx</text><rect x="580" y="272" width="104" height="46" rx="6" fill="#ffffff" stroke="#8b949e" stroke-width="1.8"/><text x="632.0" y="299.0" font-size="12.5" fill="#1f2328" text-anchor="middle" font-weight="bold">Tracker</text><text x="632.0" y="334" font-size="9.5" fill="#59636e" text-anchor="middle" font-weight="normal">full_plan [x] 갱신</text><text x="20" y="388" font-size="10.5" fill="#59636e" text-anchor="start" font-weight="normal">Tracker: 도구 없이 LLM 추론만으로 체크리스트를 [ ] → [x]로 갱신. 모든 항목이 [x]가 되기 전에는 다음 에이전트로 넘어가지 않는다</text><text x="20" y="406" font-size="10.5" fill="#59636e" text-anchor="start" font-weight="normal">Validator: calculation_metadata.json의 계산을 원천 CSV에서 다시 해 0.01 이내면 통과, 통과한 수치만 citations.json에 올라 보고서 인용이 된다</text><rect x="20" y="450" width="11" height="11" rx="2" fill="#2563eb"/><text x="36" y="460" font-size="11" fill="#1f2328" text-anchor="start" font-weight="normal">실행</text><rect x="130" y="450" width="11" height="11" rx="2" fill="#ea580c"/><text x="146" y="460" font-size="11" fill="#1f2328" text-anchor="start" font-weight="normal">사람 검토</text><rect x="240" y="450" width="11" height="11" rx="2" fill="#16a34a"/><text x="256" y="460" font-size="11" fill="#1f2328" text-anchor="start" font-weight="normal">검증</text><rect x="350" y="450" width="11" height="11" rx="2" fill="#8b949e"/><text x="366" y="460" font-size="11" fill="#1f2328" text-anchor="start" font-weight="normal">상태 추적</text><text x="712" y="484" font-size="9" fill="#8b949e" text-anchor="end">생성: python scripts/figures/deepinsight_figures.py · 손으로 고치지 말 것</text></svg>