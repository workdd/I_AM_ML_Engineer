<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="680" height="400" role="img" aria-label="사용자당 요청 수와 토큰 히트율" style="max-width:100%;height:auto;font-family:-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><title>사용자당 요청 수와 토큰 히트율</title><rect width="680" height="400" fill="#ffffff"/><text x="20" y="28" font-size="14.5" fill="#1f2328" text-anchor="start" font-weight="bold">사용자별 격리일 때 사용자당 요청 수와 토큰 히트율 (노트에서 계산)</text><text x="20" y="46" font-size="11.5" fill="#59636e" text-anchor="start" font-weight="normal">한 번 쓰고 떠나는 사용자는 이득이 없고, 반복이 많을수록 공유 그룹에 가까워진다</text><line x1="60" y1="290.0" x2="640" y2="290.0" stroke="#d8dee4"/><text x="52" y="294.0" font-size="11" fill="#59636e" text-anchor="end" font-weight="normal">0%</text><line x1="60" y1="237.5" x2="640" y2="237.5" stroke="#d8dee4"/><text x="52" y="241.5" font-size="11" fill="#59636e" text-anchor="end" font-weight="normal">25%</text><line x1="60" y1="185.0" x2="640" y2="185.0" stroke="#d8dee4"/><text x="52" y="189.0" font-size="11" fill="#59636e" text-anchor="end" font-weight="normal">50%</text><line x1="60" y1="132.5" x2="640" y2="132.5" stroke="#d8dee4"/><text x="52" y="136.5" font-size="11" fill="#59636e" text-anchor="end" font-weight="normal">75%</text><line x1="60" y1="80.0" x2="640" y2="80.0" stroke="#d8dee4"/><text x="52" y="84.0" font-size="11" fill="#59636e" text-anchor="end" font-weight="normal">100%</text><text x="60.0" y="308" font-size="11" fill="#59636e" text-anchor="middle" font-weight="normal">1</text><text x="182.10526315789474" y="308" font-size="11" fill="#59636e" text-anchor="middle" font-weight="normal">5</text><text x="334.7368421052632" y="308" font-size="11" fill="#59636e" text-anchor="middle" font-weight="normal">10</text><text x="487.36842105263156" y="308" font-size="11" fill="#59636e" text-anchor="middle" font-weight="normal">15</text><text x="640.0" y="308" font-size="11" fill="#59636e" text-anchor="middle" font-weight="normal">20</text><text x="350.0" y="328" font-size="11" fill="#59636e" text-anchor="middle" font-weight="normal">사용자당 요청 수 (문서 10,000 + 질문 500토큰)</text><line x1="60" y1="92.0" x2="640" y2="92.0" stroke="#2563eb" stroke-dasharray="6 4"/><text x="66" y="86.0" font-size="11" fill="#2563eb" text-anchor="start" font-weight="normal">단일 공유 그룹, 요청 100개: 94.3%</text><polyline points="60.0,290.0 90.5,190.0 121.1,156.7 151.6,140.0 182.1,130.0 212.6,123.3 243.2,118.6 273.7,115.0 304.2,112.2 334.7,110.0 365.3,108.2 395.8,106.7 426.3,105.4 456.8,104.3 487.4,103.3 517.9,102.5 548.4,101.8 578.9,101.1 609.5,100.5 640.0,100.0" fill="none" stroke="#ea580c" stroke-width="2.4"/><circle cx="60.0" cy="290.0" r="2.8" fill="#ea580c"/><circle cx="90.5" cy="190.0" r="2.8" fill="#ea580c"/><circle cx="121.1" cy="156.7" r="2.8" fill="#ea580c"/><circle cx="151.6" cy="140.0" r="2.8" fill="#ea580c"/><circle cx="182.1" cy="130.0" r="2.8" fill="#ea580c"/><circle cx="212.6" cy="123.3" r="2.8" fill="#ea580c"/><circle cx="243.2" cy="118.6" r="2.8" fill="#ea580c"/><circle cx="273.7" cy="115.0" r="2.8" fill="#ea580c"/><circle cx="304.2" cy="112.2" r="2.8" fill="#ea580c"/><circle cx="334.7" cy="110.0" r="2.8" fill="#ea580c"/><circle cx="365.3" cy="108.2" r="2.8" fill="#ea580c"/><circle cx="395.8" cy="106.7" r="2.8" fill="#ea580c"/><circle cx="426.3" cy="105.4" r="2.8" fill="#ea580c"/><circle cx="456.8" cy="104.3" r="2.8" fill="#ea580c"/><circle cx="487.4" cy="103.3" r="2.8" fill="#ea580c"/><circle cx="517.9" cy="102.5" r="2.8" fill="#ea580c"/><circle cx="548.4" cy="101.8" r="2.8" fill="#ea580c"/><circle cx="578.9" cy="101.1" r="2.8" fill="#ea580c"/><circle cx="609.5" cy="100.5" r="2.8" fill="#ea580c"/><circle cx="640.0" cy="100.0" r="2.8" fill="#ea580c"/><text x="66.0" y="306.0" font-size="10.5" fill="#ea580c" text-anchor="start" font-weight="normal">1회: 0.0%</text><text x="96.52631578947368" y="206.0" font-size="10.5" fill="#ea580c" text-anchor="start" font-weight="normal">2회: 47.6%</text><text x="340.7368421052632" y="126.0" font-size="10.5" fill="#ea580c" text-anchor="start" font-weight="normal">10회: 85.7%</text><text x="20" y="358" font-size="11" fill="#59636e" text-anchor="start" font-weight="normal">식: (k - 1) × 10,000 ÷ (k × 10,500). 원문 예시(사용자 10명 × 10회 = 85.7%)를 k에 대해 늘린 것이다</text><text x="20" y="376" font-size="11" fill="#59636e" text-anchor="start" font-weight="normal">k가 커지면 95.2%(문서 ÷ 요청 길이)에 다가간다. 질문 부분은 매번 새로 계산하기 때문이다</text><text x="672" y="394" font-size="9" fill="#8b949e" text-anchor="end">생성: python scripts/figures/llmcache_figures.py · 손으로 고치지 말 것</text></svg>