<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-label="1차와 2차 RL 학습 세트 구성" style="max-width:100%;height:auto;font-family:-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><title>1차와 2차 RL 학습 세트 구성</title><rect width="760" height="330" fill="#ffffff"/><text x="20" y="28" font-size="15" fill="#1f2328" text-anchor="start" font-weight="bold">2차 RL은 1차 모델 기준으로 다시 고른 문항으로 세트를 고유 문항 기준 약 1.6배 키웠다</text><text x="20" y="46" font-size="12" fill="#59636e" text-anchor="start" font-weight="normal">모델 카드 학습 과정 표. 막대 길이는 문항 수 (같은 축)</text><text x="160" y="99" font-size="13" fill="#1f2328" text-anchor="end" font-weight="bold">1차 RL</text><text x="160" y="114" font-size="11" fill="#59636e" text-anchor="end" font-weight="normal">원본 정답률로 선별</text><rect x="170" y="84" width="80.62727272727274" height="34" fill="#2563eb" stroke="#ffffff"/><text x="210.31363636363636" y="99" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="normal">기출 22~26</text><text x="210.31363636363636" y="113" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">181</text><rect x="250.62727272727273" y="84" width="65.03636363636363" height="34" fill="#93c5fd" stroke="#ffffff"/><text x="283.1454545454545" y="99" font-size="11" fill="#1f2328" text-anchor="middle" font-weight="normal">4점 17~21</text><text x="283.1454545454545" y="113" font-size="11" fill="#1f2328" text-anchor="middle" font-weight="bold">146</text><rect x="315.66363636363633" y="84" width="158.5818181818182" height="34" fill="#a78bfa" stroke="#ffffff"/><text x="394.95454545454544" y="99" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="normal">검증 합성 변형</text><text x="394.95454545454544" y="113" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">356</text><text x="482.24545454545455" y="106" font-size="12" fill="#1f2328" text-anchor="start" font-weight="bold">683문항</text><text x="160" y="185" font-size="13" fill="#1f2328" text-anchor="end" font-weight="bold">2차 RL</text><text x="160" y="200" font-size="11" fill="#59636e" text-anchor="end" font-weight="normal">1차 step 40 정답률로 재선별</text><rect x="170" y="170" width="141.20909090909092" height="34" fill="#2563eb" stroke="#ffffff"/><text x="240.60454545454547" y="185" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="normal">기출</text><text x="240.60454545454547" y="199" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">317</text><rect x="311.20909090909095" y="170" width="250.34545454545452" height="34" fill="#93c5fd" stroke="#ffffff"/><text x="436.3818181818182" y="185" font-size="11" fill="#1f2328" text-anchor="middle" font-weight="normal">어려운 합성 변형</text><text x="436.3818181818182" y="199" font-size="11" fill="#1f2328" text-anchor="middle" font-weight="bold">562</text><rect x="561.5545454545454" y="170" width="58.35454545454545" height="34" fill="#a78bfa" stroke="#ffffff"/><text x="590.7318181818181" y="185" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="normal">디딤돌</text><text x="590.7318181818181" y="199" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">131</text><rect x="619.9090909090909" y="170" width="11.136363636363637" height="34" fill="#fbbf24" stroke="#ffffff"/><rect x="631.0454545454545" y="170" width="19.154545454545456" height="34" fill="#34d399" stroke="#ffffff"/><rect x="650.1999999999999" y="170" width="1.7818181818181817" height="34" fill="#dc2626" stroke="#ffffff"/><text x="659.9818181818181" y="184" font-size="12" fill="#1f2328" text-anchor="start" font-weight="bold">구성 합 1,082</text><text x="659.9818181818181" y="200" font-size="12" fill="#dc2626" text-anchor="start" font-weight="bold">고유 1,078</text><text x="170" y="226" font-size="12" fill="#1f2328" text-anchor="start" font-weight="normal">정답률 25% 이하 67문항을 2배로 넣어 학습 행은 1,078 + 67 = 1,145행</text><text x="170" y="246" font-size="12" fill="#dc2626" text-anchor="start" font-weight="normal">구성 항목을 