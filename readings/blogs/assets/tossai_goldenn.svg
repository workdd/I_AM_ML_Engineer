<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 430" width="680" height="430" role="img" aria-label="골든셋 문항 수와 정답률 변화의 문항 수" style="max-width:100%;height:auto;font-family:-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><title>골든셋 문항 수와 정답률 변화의 문항 수</title><rect width="680" height="430" fill="#ffffff"/><text x="20" y="28" font-size="14.5" fill="#1f2328" text-anchor="start" font-weight="bold">골든셋 문항 수에 따라 4포인트 · 10포인트 변화가 몇 문항인지 (노트에서 계산)</text><text x="20" y="46" font-size="11.5" fill="#59636e" text-anchor="start" font-weight="normal">빨간 선: 같은 세트 전후 비교에서 바뀐 문항이 모두 한 방향일 때 우연이 아니라고 말할 최소 문항 수 (6문항, 양측 5%)</text><line x1="70" y1="300.0" x2="600" y2="300.0" stroke="#d8dee4"/><text x="62" y="304.0" font-size="11" fill="#59636e" text-anchor="end" font-weight="normal">0</text><line x1="70" y1="263.3333333333333" x2="600" y2="263.3333333333333" stroke="#d8dee4"/><text x="62" y="267.3333333333333" font-size="11" fill="#59636e" text-anchor="end" font-weight="normal">5</text><line x1="70" y1="226.66666666666669" x2="600" y2="226.66666666666669" stroke="#d8dee4"/><text x="62" y="230.66666666666669" font-size="11" fill="#59636e" text-anchor="end" font-weight="normal">10</text><line x1="70" y1="190.0" x2="600" y2="190.0" stroke="#d8dee4"/><text x="62" y="194.0" font-size="11" fill="#59636e" text-anchor="end" font-weight="normal">15</text><line x1="70" y1="153.33333333333334" x2="600" y2="153.33333333333334" stroke="#d8dee4"/><text x="62" y="157.33333333333334" font-size="11" fill="#59636e" text-anchor="end" font-weight="normal">20</text><line x1="70" y1="116.66666666666666" x2="600" y2="116.66666666666666" stroke="#d8dee4"/><text x="62" y="120.66666666666666" font-size="11" fill="#59636e" text-anchor="end" font-weight="normal">25</text><line x1="70" y1="80.0" x2="600" y2="80.0" stroke="#d8dee4"/><text x="62" y="84.0" font-size="11" fill="#59636e" text-anchor="end" font-weight="normal">30</text><text x="70.0" y="318" font-size="11" fill="#59636e" text-anchor="middle" font-weight="normal">0</text><text x="158.33333333333331" y="318" font-size="11" fill="#59636e" text-anchor="middle" font-weight="normal">50</text><text x="246.66666666666666" y="318" font-size="11" fill="#59636e" text-anchor="middle" font-weight="normal">100</text><text x="335.0" y="318" font-size="11" fill="#59636e" text-anchor="middle" font-weight="normal">150</text><text x="423.3333333333333" y="318" font-size="11" fill="#59636e" text-anchor="middle" font-weight="normal">200</text><text x="511.6666666666667" y="318" font-size="11" fill="#59636e" text-anchor="middle" font-weight="normal">250</text><text x="600.0" y="318" font-size="11" fill="#59636e" text-anchor="middle" font-weight="normal">300</text><text x="335.0" y="338" font-size="11" fill="#59636e" text-anchor="middle" font-weight="normal">골든셋 문항 수 N</text><text x="30" y="68" font-size="11" fill="#59636e" text-anchor="start" font-weight="normal">바뀌는 문항 수</text><line x1="70" y1="256.0" x2="600" y2="256.0" stroke="#dc2626" stroke-dasharray="4 4"/><text x="596" y="250.0" font-size="11" fill="#dc2626" text-anchor="end" font-weight="normal">6문항: p = 0.031</text><polyline points="70.0,300.0 114.2,281.7 158.3,263.3 202.5,245.0 246.7,226.7 290.8,208.3 335.0,190.0 379.2,171.7 423.3,153.3 467.5,135.0 511.7,116.7 555.8,98.3 600.0,80.0" fill="none" stroke="#ea580c" stroke-width="2.4"/><circle cx="176.0" cy="256.0" r="4.5" fill="#ea580c"/><text x="184.0" y="274.0" font-size="12" fill="#ea580c" text-anchor="start" font-weight="bold">N=60</text><text x="596.0" y="72.0" font-size="11" fill="#ea580c" text-anchor="end" font-weight="normal">10포인트 (하룻밤 급락의 최소폭)</text><polyline points="70.0,300.0 114.2,292.7 158.3,285.3 202.5,278.0 246.7,270.7 290.8,263.3 335.0,256.0 379.2,248.7 423.3,241.3 467.5,234.0 511.7,226.7 555.8,219.3 600.0,212.0" fill="none" stroke="#2563eb" stroke-width="2.4"/><circle cx="335.0" cy="256.0" r="4.5" fill="#2563eb"/><text x="343.0" y="274.0" font-size="12" fill="#2563eb" text-anchor="start" font-weight="bold">N=150</text><text x="596.0" y="204.0" font-size="11" fill="#2563eb" text-anchor="end" font-weight="normal">4포인트 (지식 보강 94%→98%)</text><text x="20" y="370" font-size="11" fill="#59636e" text-anchor="start" font-weight="normal">최선의 경우에도 4포인트 개선을 우연과 가르려면 골든셋이 150문항 이상이어야 하고, 10포인트 급락은 60문항이면 잡힌다</text><text x="20" y="388" font-size="11" fill="#59636e" text-anchor="start" font-weight="normal">좋아진 문항과 나빠진 문항이 섞이면 필요한 문항 수는 더 늘어난다. 매일 밤 비교라면 같은 세트를 쓰는 대응 비교가 맞다</text><text x="20" y="406" font-size="11" fill="#59636e" text-anchor="start" font-weight="normal">원문은 골든셋 문항 수를 밝히지 않았으므로 원문 결과의 유의성을 판정하는 그림이 아니다</text><text x="672" y="424" font-size="9" fill="#8b949e" text-anchor="end">생성: python scripts/figures/tossai_figures.py · 손으로 고치지 말 것</text></svg>