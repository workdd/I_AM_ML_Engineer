<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" role="img" aria-label="마킹과 역할에 따른 접근 판정 매트릭스" style="max-width:100%;height:auto;font-family:-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><title>마킹과 역할에 따른 접근 판정 매트릭스</title><rect width="760" height="430" fill="#ffffff"/><text x="20" y="28" font-size="15" fill="#1f2328" text-anchor="start" font-weight="bold">같은 데이터 계보에서도 사용자마다 결과가 네 가지로 갈린다</text><text x="20" y="46" font-size="12" fill="#59636e" text-anchor="start" font-weight="normal">원문 규칙(마킹 AND, 파일 마킹 → 역할 → 데이터 마킹 순)을 가상 사용자 4명과 자원 4개에 적용</text><text x="240.0" y="82" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="bold">salary_raw</text><text x="240.0" y="98" font-size="11" fill="#59636e" text-anchor="middle" font-weight="normal">재무 Project</text><text x="240.0" y="112" font-size="10.5" fill="#59636e" text-anchor="middle" font-weight="normal">Raw Data(폴더 상속) + PII</text><text x="380.0" y="82" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="bold">salary_clean</text><text x="380.0" y="98" font-size="11" fill="#59636e" text-anchor="middle" font-weight="normal">재무 Project</text><text x="380.0" y="112" font-size="10.5" fill="#59636e" text-anchor="middle" font-weight="normal">상위에서 PII 상속</text><text x="520.0" y="82" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="bold">salary_masked</text><text x="520.0" y="98" font-size="11" fill="#59636e" text-anchor="middle" font-weight="normal">재무 Project</text><text x="520.0" y="112" font-size="10.5" fill="#59636e" text-anchor="middle" font-weight="normal">PII 해싱 후 전파 중단</text><text x="660.0" y="82" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="bold">hr_notes</text><text x="660.0" y="98" font-size="11" fill="#59636e" text-anchor="middle" font-weight="normal">인사 Project</text><text x="660.0" y="112" font-size="10.5" fill="#59636e" text-anchor="middle" font-weight="normal">PII 직접 적용</text><text x="20" y="142" font-size="12.5" fill="#1f2328" text-anchor="start" font-weight="bold">재무 분석가</text><text x="20" y="158" font-size="10.5" fill="#59636e" text-anchor="start" font-weight="normal">역할: 재무 / 자격: PII</text><rect x="174" y="124" width="132" height="42" rx="6" fill="#fee2e2"/><text x="240.0" y="150" font-size="12.5" fill="#991b1b" text-anchor="middle" font-weight="bold">발견 불가</text><rect x="314" y="124" width="132" height="42" rx="6" fill="#dcfce7"/><text x="380.0" y="150" font-size="12.5" fill="#166534" text-anchor="middle" font-weight="bold">데이터 열람</text><rect x="454" y="124" width="132" height="42" rx="6" fill="#dcfce7"/><text x="520.0" y="150" font-size="12.5" fill="#166534" text-anchor="middle" font-weight="bold">데이터 열람</text><rect x="594" y="124" width="132" height="42" rx="6" fill="#eef0f2"/><text x="660.0" y="150" font-size="12.5" fill="#424a53" text-anchor="middle" font-weight="bold">접근 불가</text><text x="20" y="192" font-size="12.5" fill="#1f2328" text-anchor="start" font-weight="bold">재무 신입 (교육 전)</text><text x="20" y="208" font-size="10.5" fill="#59636e" text-anchor="start" font-weight="normal">역할: 재무 / 자격: 없음</text><rect x="174" y="174" width="132" height="42" rx="6" fill="#fee2e2"/><text x="240.0" y="200" font-size="12.5" fill="#991b1b" text-anchor="middle" font-weight="bold">발견 불가</text><rect x="314" y="174" width="132" height="42" rx="6" fill="#fef9c3"/><text x="380.0" y="200" font-size="12.5" fill="#854d0e" text-anchor="middle" font-weight="bold">메타데이터만</text><rect x="454" y="174" width="132" height="42" rx="6" fill="#dcfce7"/><text x="520.0" y="200" font-size="12.5" fill="#166534" text-anchor="middle" font-weight="bold">데이터 열람</text><rect x="594" y="174" width="132" height="42" rx="6" fill="#fee2e2"/><text x="660.0" y="200" font-size="12.5" fill="#991b1b" text-anchor="middle" font-weight="bold">발견 불가</text><text x="20" y="242" font-size="12.5" fill="#1f2328" text-anchor="start" font-weight="bold">인사 담당</text><text x="20" y="258" font-size="10.5" fill="#59636e" text-anchor="start" font-weight="normal">역할: 인사 / 자격: PII</text><rect x="174" y="224" width="132" height="42" rx="6" fill="#fee2e2"/><text x="240.0" y="250" font-size="12.5" fill="#991b1b" text-anchor="middle" font-weight="bold">발견 불가</text><rect x="314" y="224" width="132" height="42" rx="6" fill="#eef0f2"/><text x="380.0" y="250" font-size="12.5" fill="#424a53" text-anchor="middle" font-weight="bold">접근 불가</text><rect x="454" y="224" width="132" height="42" rx="6" fill="#eef0f2"/><text x="520.0" y="250" font-size="12.5" fill="#424a53" text-anchor="middle" font-weight="bold">접근 불가</text><rect x="594" y="224" width="132" height="42" rx="6" fill="#dcfce7"/><text x="660.0" y="250" font-size="12.5" fill="#166534" text-anchor="middle" font-weight="bold">데이터 열람</text><text x="20" y="292" font-size="12.5" fill="#1f2328" text-anchor="start" font-weight="bold">데이터 엔지니어</text><text x="20" y="308" font-size="10.5" fill="#59636e" text-anchor="start" font-weight="normal">역할: 재무 / 자격: PII, Raw Data</text><rect x="174" y="274" width="132" height="42" rx="6" fill="#dcfce7"/><text x="240.0" y="300" font-size="12.5" fill="#166534" text-anchor="middle" font-weight="bold">데이터 열람</text><rect x="314" y="274" width="132" height="42" rx="6" fill="#dcfce7"/><text x="380.0" y="300" font-size="12.5" fill="#166534" text-anchor="middle" font-weight="bold">데이터 열람</text><rect x="454" y="274" width="132" height="42" rx="6" fill="#dcfce7"/><text x="520.0" y="300" font-size="12.5" fill="#166534" text-anchor="middle" font-weight="bold">데이터 열람</text><rect x="594" y="274" width="132" height="42" rx="6" fill="#eef0f2"/><text x="660.0" y="300" font-size="12.5" fill="#424a53" text-anchor="middle" font-weight="bold">접근 불가</text><rect x="20" y="336" width="86" height="18" rx="4" fill="#fee2e2"/><text x="63" y="349" font-size="11" fill="#991b1b" text-anchor="middle" font-weight="bold">발견 불가</text><text x="114" y="349" font-size="11" fill="#59636e" text-anchor="start" font-weight="normal">파일 마킹 미충족: 검색, 폴더 보기에서 숨김</text><rect x="390" y="336" width="86" height="18" rx="4" fill="#eef0f2"/><text x="433" y="349" font-size="11" fill="#424a53" text-anchor="middle" font-weight="bold">접근 불가</text><text x="484" y="349" font-size="11" fill="#59636e" text-anchor="start" font-weight="normal">마킹은 충족, 역할 없음: 자격과 접근은 별개</text><rect x="20" y="360" width="86" height="18" rx="4" fill="#fef9c3"/><text x="63" y="373" font-size="11" fill="#854d0e" text-anchor="middle" font-weight="bold">메타데이터만</text><text x="114" y="373" font-size="11" fill="#59636e" text-anchor="start" font-weight="normal">파일 요건 충족, 상속된 데이터 마킹 미충족</text><rect x="390" y="360" width="86" height="18" rx="4" fill="#dcfce7"/><text x="433" y="373" font-size="11" fill="#166534" text-anchor="middle" font-weight="bold">데이터 열람</text><text x="484" y="373" font-size="11" fill="#59636e" text-anchor="start" font-weight="normal">역할과 모든 마킹 충족</text><text x="20" y="408" font-size="10.5" fill="#8b949e" text-anchor="start" font-weight="normal">사용자와 자원은 규칙 설명용 가상 사례이며 원문에 없다</text><text x="752" y="424" font-size="9" fill="#8b949e" text-anchor="end">생성: python scripts/figures/pmark_figures.py, 손으로 고치지 말 것</text></svg>