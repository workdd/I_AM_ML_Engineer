<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 230" width="640" height="230" role="img" aria-label="검증 요청의 채택과 Fallback 분해" style="max-width:100%;height:auto;font-family:-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><title>검증 요청의 채택과 Fallback 분해</title><rect width="640" height="230" fill="#ffffff"/><text x="20" y="28" font-size="15" fill="#1f2328" text-anchor="start" font-weight="bold">검증 요청 100,648건 중 약 3분의 1을 작은 모델이 처리한다</text><text x="20" y="46" font-size="12" fill="#59636e" text-anchor="start" font-weight="normal">목표 일치율 99.9% threshold 적용 결과. 나머지는 기존 LLM으로 Fallback</text><rect x="30" y="92" width="201.4798108258485" height="46" fill="#2563eb"/><rect x="231.4798108258485" y="92" width="378.5201891741515" height="46" fill="#d8dee4"/><rect x="231.28388045465383" y="92" width="0.19593037119466317" height="46" fill="#dc2626"/><text x="130.73990541292426" y="121" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">채택 34,963건 (34.74%)</text><text x="420.73990541292426" y="121" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="bold">Fallback 65,685건</text><line x1="231.4798108258485" y1="138" x2="231.4798108258485" y2="160" stroke="#dc2626"/><text x="231.4798108258485" y="174" font-size="12" fill="#dc2626" text-anchor="middle" font-weight="normal">채택 중 LLM 판단과 불일치 34건 (일치율 99.9028%)</text><text x="30" y="82" font-size="11" fill="#59636e" text-anchor="start" font-weight="normal">conf ≥ τ: 작은 모델 결과 사용</text><text x="610" y="82" font-size="11" fill="#59636e" text-anchor="end" font-weight="normal">conf &lt; τ: 기존 LLM 추가 호출</text><text x="632" y="224" font-size="9" fill="#8b949e" text-anchor="end">생성: python scripts/figures/snap_figures.py · 손으로 고치지 말 것</text></svg>