<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" width="680" height="420" role="img" aria-label="검색 hop 수와 연속 성공 확률" style="max-width:100%;height:auto;font-family:-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><title>검색 hop 수와 연속 성공 확률</title><rect width="680" height="420" fill="#ffffff"/><text x="20" y="28" font-size="14.5" fill="#1f2328" text-anchor="start" font-weight="bold">검색을 이어 붙일 때 모든 hop 이 성공할 확률 (노트에서 계산)</text><text x="20" y="46" font-size="11.5" fill="#59636e" text-anchor="start" font-weight="normal">hop 마다 필요한 문서가 상위 k 에 들 확률을 p 로 두고, hop 사이가 독립이라고 가정한 p^n</text><line x1="60" y1="300" x2="600" y2="300" stroke="#d8dee4"/><text x="52" y="304" font-size="11" fill="#59636e" text-anchor="end" font-weight="normal">0%</text><line x1="60" y1="245.0" x2="600" y2="245.0" stroke="#d8dee4"/><text x="52" y="249.0" font-size="11" fill="#59636e" text-anchor="end" font-weight="normal">25%</text><line x1="60" y1="190.0" x2="600" y2="190.0" stroke="#d8dee4"/><text x="52" y="194.0" font-size="11" fill="#59636e" text-anchor="end" font-weight="normal">50%</text><line x1="60" y1="135.0" x2="600" y2="135.0" stroke="#d8dee4"/><text x="52" y="139.0" font-size="11" fill="#59636e" text-anchor="end" font-weight="normal">75%</text><line x1="60" y1="80.0" x2="600" y2="80.0" stroke="#d8dee4"/><text x="52" y="84.0" font-size="11" fill="#59636e" text-anchor="end" font-weight="normal">100%</text><line x1="60" y1="190.0" x2="600" y2="190.0" stroke="#dc2626" stroke-dasharray="4 4"/><text x="66" y="184.0" font-size="11" fill="#dc2626" text-anchor="start" font-weight="normal">절반</text><text x="60.0" y="318" font-size="11" fill="#59636e" text-anchor="middle" font-weight="normal">1</text><text x="168.0" y="318" font-size="11" fill="#59636e" text-anchor="middle" font-weight="normal">2</text><text x="276.0" y="318" font-size="11" fill="#59636e" text-anchor="middle" font-weight="normal">3</text><text x="384.0" y="318" font-size="11" fill="#59636e" text-anchor="middle" font-weight="normal">4</text><text x="492.0" y="318" font-size="11" fill="#59636e" text-anchor="middle" font-weight="normal">5</text><text x="600.0" y="318" font-size="11" fill="#59636e" text-anchor="middle" font-weight="normal">6</text><text x="330.0" y="338" font-size="11" fill="#59636e" text-anchor="middle" font-weight="normal">이어 붙인 검색 hop 수</text><polyline points="60.0,102.0 168.0,121.8 276.0,139.6 384.0,155.7 492.0,170.1 600.0,183.1" fill="none" stroke="#16a34a" stroke-width="2.4"/><circle cx="60.0" cy="102.0" r="3" fill="#16a34a"/><circle cx="168.0" cy="121.8" r="3" fill="#16a34a"/><circle cx="276.0" cy="139.6" r="3" fill="#16a34a"/><circle cx="384.0" cy="155.7" r="3" fill="#16a34a"/><circle cx="492.0" cy="170.1" r="3" fill="#16a34a"/><circle cx="600.0" cy="183.1" r="3" fill="#16a34a"/><text x="606.0" y="187.08298" font-size="11" fill="#16a34a" text-anchor="start" font-weight="normal">p=0.9</text><polyline points="60.0,124.0 168.0,159.2 276.0,187.4 384.0,209.9 492.0,227.9 600.0,242.3" fill="none" stroke="#ea580c" stroke-width="2.4"/><circle cx="60.0" cy="124.0" r="3" fill="#ea580c"/><circle cx="168.0" cy="159.2" r="3" fill="#ea580c"/><circle cx="276.0" cy="187.4" r="3" fill="#ea580c"/><circle cx="384.0" cy="209.9" r="3" fill="#ea580c"/><circle cx="492.0" cy="227.9" r="3" fill="#ea580c"/><circle cx="600.0" cy="242.3" r="3" fill="#ea580c"/><text x="606.0" y="246.32831999999996" font-size="11" fill="#ea580c" text-anchor="start" font-weight="normal">p=0.8</text><polyline points="60.0,146.0 168.0,192.2 276.0,224.5 384.0,247.2 492.0,263.0 600.0,274.1" fill="none" stroke="#2563eb" stroke-width="2.4"/><circle cx="60.0" cy="146.0" r="3" fill="#2563eb"/><circle cx="168.0" cy="192.2" r="3" fill="#2563eb"/><circle cx="276.0" cy="224.5" r="3" fill="#2563eb"/><circle cx="384.0" cy="247.2" r="3" fill="#2563eb"/><circle cx="492.0" cy="263.0" r="3" fill="#2563eb"/><circle cx="600.0" cy="274.1" r="3" fill="#2563eb"/><text x="606.0" y="278.11722000000003" font-size="11" fill="#2563eb" text-anchor="start" font-weight="normal">p=0.7</text><text x="282.0" y="179.35999999999996" font-size="11" fill="#ea580c" text-anchor="start" font-weight="bold">3 hop: 0.512</text><text x="390.0" y="201.88799999999998" font-size="11" fill="#ea580c" text-anchor="start" font-weight="bold">4 hop: 0.410</text><text x="20" y="378" font-size="11" fill="#59636e" text-anchor="start" font-weight="normal">발표는 p=0.8 이면 3번 연속 성공이 절반 이하라고 했다. 계산하면 0.8^3 = 0.512 로 절반을 약간 넘고,</text><text x="20" y="396" font-size="11" fill="#59636e" text-anchor="start" font-weight="normal">4 hop 부터 0.410 로 절반 아래다. 결론(이을수록 빠르게 줄어든다)은 그대로다</text><text x="672" y="414" font-size="9" fill="#8b949e" text-anchor="end">생성: python scripts/figures/kpaykg_figures.py · 손으로 고치지 말 것</text></svg>