<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-label="Claude Code 팀의 변경량, 리뷰 코멘트 비율, 위험 등급" style="max-width:100%;height:auto;font-family:-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><title>Claude Code 팀의 변경량, 리뷰 코멘트 비율, 위험 등급</title><rect width="760" height="400" fill="#ffffff"/><text x="20" y="28" font-size="15" fill="#1f2328" text-anchor="start" font-weight="bold">변경량이 10배 넘게 늘어난 환경에서 Claude Code 팀은 사람 승인 수를 변경 위험으로 나눈다</text><text x="20" y="46" font-size="12" fill="#59636e" text-anchor="start" font-weight="normal">함께 읽은 claude.dev 블로그 수치. 왼쪽 두 막대는 서로 다른 축</text><text x="50" y="80" font-size="12" fill="#1f2328" text-anchor="start" font-weight="bold">모노레포 하루 변경 수</text><rect x="50" y="311.8333333333333" width="44" height="18.166666666666668" rx="3" fill="#8b949e"/><text x="72" y="305.8333333333333" font-size="11" fill="#1f2328" text-anchor="middle" font-weight="bold">2,500</text><text x="72" y="346" font-size="12" fill="#59636e" text-anchor="middle" font-weight="normal">5월</text><rect x="120" y="112.0" width="44" height="218.0" rx="3" fill="#d97757"/><text x="142" y="106.0" font-size="11" fill="#1f2328" text-anchor="middle" font-weight="bold">30,000+</text><text x="142" y="346" font-size="12" fill="#59636e" text-anchor="middle" font-weight="normal">9월</text><text x="50" y="366" font-size="12" fill="#d97757" text-anchor="start" font-weight="bold">약 12배</text><text x="250" y="80" font-size="12" fill="#1f2328" text-anchor="start" font-weight="bold">실질 리뷰 코멘트를 받은 PR</text><rect x="250" y="295.12" width="44" height="34.88" rx="3" fill="#8b949e"/><text x="272" y="289.12" font-size="11" fill="#1f2328" text-anchor="middle" font-weight="bold">16%</text><text x="272" y="346" font-size="12" fill="#59636e" text-anchor="middle" font-weight="normal">이전</text><rect x="320" y="212.28" width="44" height="117.72" rx="3" fill="#2563eb"/><text x="342" y="206.28" font-size="11" fill="#1f2328" text-anchor="middle" font-weight="bold">54%</text><text x="342" y="346" font-size="12" fill="#59636e" text-anchor="middle" font-weight="normal">preview</text><line x1="244" y1="112" x2="370" y2="112" stroke="#d8dee4" stroke-dasharray="3 3"/><text x="374" y="116" font-size="10" fill="#59636e" text-anchor="start" font-weight="normal">100%</text><text x="450" y="80" font-size="12" fill="#1f2328" text-anchor="start" font-weight="bold">위험 등급별 필요한 사람 승인</text><text x="450" y="120" font-size="13" fill="#1f2328" text-anchor="start" font-weight="bold">Low</text><rect x="520" y="104" width="24" height="24" rx="5" fill="none" stroke="#8b949e" stroke-dasharray="4 3"/><text x="590" y="121" font-size="12" fill="#1f2328" text-anchor="start" font-weight="bold">0명</text><text x="450" y="146" font-size="11" fill="#59636e" text-anchor="start" font-weight="normal">문서, 문구, 내부 전용, flag 뒤 추가 변경</text><text x="450" y="192" font-size="13" fill="#1f2328" text-anchor="start" font-weight="bold">Medium</text><rect x="520" y="176" width="24" height="24" rx="5" fill="#2563eb"/><text x="590" y="193" font-size="12" fill="#1f2328" text-anchor="start" font-weight="bold">1명</text><text x="450" y="218" font-size="11" fill="#59636e" text-anchor="start" font-weight="normal">일반 제품 변경, 캐시, auto-updater, system prompt</text><text x="450" y="264" font-size="13" fill="#1f2328" text-anchor="start" font-weight="bold">High</text><rect x="520" y="248" width="24" height="24" rx="5" fill="#2563eb"/><rect x="550" y="248" width="24" height="24" rx="5" fill="#2563eb"/><text x="590" y="265" font-size="12" fill="#1f2328" text-anchor="start" font-weight="bold">2명</text><text x="450" y="290" font-size="11" fill="#59636e" text-anchor="start" font-weight="normal">최고 위험 코드, 항상 2명이 필요한 경로</text><text x="450" y="324" font-size="11" fill="#1f2328" text-anchor="start" font-weight="normal">등급은 작성자가 아니라 변경을 읽은 분류기가 정한다</text><text x="450" y="340" font-size="11" fill="#dc2626" text-anchor="start" font-weight="normal">에이전트 승인은 사람 승인 칸을 채우지 못한다</text><text x="752" y="394" font-size="9" fill="#8b949e" text-anchor="end">생성: python scripts/figures/ship_figures.py, 손으로 고치지 말 것</text></svg>