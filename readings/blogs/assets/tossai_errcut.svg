<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" width="680" height="360" role="img" aria-label="정답률 94%에서 98%로 오른 것을 오답률로 본 그림" style="max-width:100%;height:auto;font-family:-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><title>정답률 94%에서 98%로 오른 것을 오답률로 본 그림</title><rect width="680" height="360" fill="#ffffff"/><text x="20" y="28" font-size="14.5" fill="#1f2328" text-anchor="start" font-weight="bold">정답률 94% → 98% 를 오답률로 보면 (원문 수치로 계산)</text><text x="20" y="46" font-size="11.5" fill="#59636e" text-anchor="start" font-weight="normal">막대는 100 문항 중 틀리는 문항 수. 정답률은 4포인트 차이지만 오답은 세 개 중 두 개가 사라진다</text><rect x="230" y="80.0" width="90" height="180.0" fill="#8b949e" rx="3"/><text x="275.0" y="72.0" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="bold">10문항</text><text x="275.0" y="278" font-size="11" fill="#59636e" text-anchor="middle" font-weight="normal">정답률 90% (원문: 90% 초과)</text><rect x="380" y="152.0" width="90" height="108.0" fill="#ea580c" rx="3"/><text x="425.0" y="144.0" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="bold">6문항</text><text x="425.0" y="278" font-size="11" fill="#59636e" text-anchor="middle" font-weight="normal">보강 전 94%</text><rect x="530" y="224.0" width="90" height="36.0" fill="#16a34a" rx="3"/><text x="575.0" y="216.0" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="bold">2문항</text><text x="575.0" y="278" font-size="11" fill="#59636e" text-anchor="middle" font-weight="normal">보강 후 98%</text><line x1="210" y1="260" x2="640" y2="260" stroke="#d8dee4"/><text x="20" y="140" font-size="12" fill="#1f2328" text-anchor="start" font-weight="bold">오답률</text><text x="20" y="160" font-size="22" fill="#16a34a" text-anchor="start" font-weight="bold">6% → 2%</text><text x="20" y="182" font-size="12" fill="#59636e" text-anchor="start" font-weight="normal">오답 67% 감소</text><text x="20" y="318" font-size="11" fill="#59636e" text-anchor="start" font-weight="normal">같은 4포인트라도 정답률이 높을수록 남은 오답 중 큰 몫이다. 90%대에서 개선 효과는 오답률로 읽는 편이 크기가 드러난다</text><text x="20" y="336" font-size="11" fill="#59636e" text-anchor="start" font-weight="normal">100 문항은 비율을 보이기 위한 단위다. 원문은 골든셋 문항 수를 밝히지 않았다</text><text x="672" y="354" font-size="9" fill="#8b949e" text-anchor="end">생성: python scripts/figures/tossai_figures.py · 손으로 고치지 말 것</text></svg>