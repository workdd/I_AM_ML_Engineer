<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 330" width="700" height="330" role="img" aria-label="새로 prefill할 입력 토큰" style="max-width:100%;height:auto;font-family:-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><title>새로 prefill할 입력 토큰</title><rect width="700" height="330" fill="#ffffff"/><text x="20" y="28" font-size="14.5" fill="#1f2328" text-anchor="start" font-weight="bold">새로 prefill할 입력 토큰 (가상 예시: 요청 100개, 문서 10,000 + 질문 500토큰)</text><text x="20" y="46" font-size="11.5" fill="#59636e" text-anchor="start" font-weight="normal">격리해도 같은 사용자 안의 반복은 재사용된다. 막대는 토큰 수이고 시간·비용이 아니다</text><text x="218" y="112" font-size="12.5" fill="#1f2328" text-anchor="end" font-weight="bold">캐시 없음</text><rect x="230" y="96" width="360.0" height="26" fill="#8b949e"/><text x="598.0" y="114" font-size="12" fill="#1f2328" text-anchor="start" font-weight="bold">1,050,000</text><text x="218" y="168" font-size="12.5" fill="#1f2328" text-anchor="end" font-weight="bold">사용자별 격리 (10명 × 10회)</text><rect x="230" y="152" width="51.4" height="26" fill="#ea580c"/><text x="289.42857142857144" y="170" font-size="12" fill="#1f2328" text-anchor="start" font-weight="bold">150,000</text><text x="289.42857142857144" y="186" font-size="10.5" fill="#ea580c" text-anchor="start" font-weight="normal">토큰 기준 히트율 85.7%</text><text x="218" y="224" font-size="12.5" fill="#1f2328" text-anchor="end" font-weight="bold">단일 공유 그룹 (100회)</text><rect x="230" y="208" width="20.6" height="26" fill="#2563eb"/><text x="258.57142857142856" y="226" font-size="12" fill="#1f2328" text-anchor="start" font-weight="bold">60,000</text><text x="258.57142857142856" y="242" font-size="10.5" fill="#2563eb" text-anchor="start" font-weight="normal">토큰 기준 히트율 94.3%</text><text x="20" y="286" font-size="11" fill="#59636e" text-anchor="start" font-weight="normal">가정: 빈 캐시에서 시작, 만료·퇴거·라우팅 미스·블록 경계 손실 없음, 동일 모델·동일 문서</text><text x="20" y="304" font-size="11" fill="#59636e" text-anchor="start" font-weight="normal">히트율 = 캐시에서 읽은 입력 토큰 ÷ 전체 입력 토큰. 비용 절감률이 아니다</text><text x="692" y="324" font-size="9" fill="#8b949e" text-anchor="end">생성: python scripts/figures/llmcache_figures.py · 손으로 고치지 말 것</text></svg>