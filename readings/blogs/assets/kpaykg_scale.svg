<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="680" height="400" role="img" aria-label="기사 한 건당 사건과 엣지 수" style="max-width:100%;height:auto;font-family:-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><title>기사 한 건당 사건과 엣지 수</title><rect width="680" height="400" fill="#ffffff"/><text x="20" y="28" font-size="14.5" fill="#1f2328" text-anchor="start" font-weight="bold">넉 달 실측 규모를 기사 한 건당 값으로 바꾸면 (32쪽 값으로 계산)</text><text x="20" y="46" font-size="11.5" fill="#59636e" text-anchor="start" font-weight="normal">2026.04~2026.08 실측. 막대는 만 단위 개수, 오른쪽은 기사 8만 건으로 나눈 값</text><text x="180" y="98" font-size="12" fill="#1f2328" text-anchor="end" font-weight="normal">뉴스 기사 (필터 후)</text><rect x="190" y="80" width="23.1" height="26" fill="#8b949e" opacity="1" rx="3"/><text x="219.11111111111111" y="98" font-size="12" fill="#1f2328" text-anchor="start" font-weight="bold">8만</text><text x="273.1111111111111" y="98" font-size="11" fill="#59636e" text-anchor="start" font-weight="normal">기준</text><text x="180" y="148" font-size="12" fill="#1f2328" text-anchor="end" font-weight="normal">원시 사건 (추출 직후)</text><rect x="190" y="130" width="66.4" height="26" fill="#ea580c" opacity="1" rx="3"/><text x="262.44444444444446" y="148" font-size="12" fill="#1f2328" text-anchor="start" font-weight="bold">23만</text><text x="316.44444444444446" y="148" font-size="11" fill="#59636e" text-anchor="start" font-weight="normal">기사당 2.9</text><text x="180" y="198" font-size="12" fill="#1f2328" text-anchor="end" font-weight="normal">사건 노드 (통합 후)</text><rect x="190" y="180" width="34.7" height="26" fill="#2563eb" opacity="1" rx="3"/><text x="230.66666666666666" y="198" font-size="12" fill="#1f2328" text-anchor="start" font-weight="bold">12만</text><text x="284.66666666666663" y="198" font-size="11" fill="#59636e" text-anchor="start" font-weight="normal">기사당 1.5 · 통합으로 48% 감소</text><text x="180" y="248" font-size="12" fill="#1f2328" text-anchor="end" font-weight="normal">엣지 전체</text><rect x="190" y="230" width="260.0" height="26" fill="#16a34a" opacity="1" rx="3"/><text x="456.0" y="248" font-size="12" fill="#1f2328" text-anchor="start" font-weight="bold">90만</text><text x="510.0" y="248" font-size="11" fill="#59636e" text-anchor="start" font-weight="normal">기사당 11.25 · 사건당 7.5</text><text x="180" y="298" font-size="12" fill="#1f2328" text-anchor="end" font-weight="normal">그중 IMPACTS</text><rect x="190" y="280" width="139.0" height="26" fill="#16a34a" opacity="0.55" rx="3"/><text x="334.9555555555555" y="298" font-size="12" fill="#1f2328" text-anchor="start" font-weight="bold">48.1만</text><text x="388.9555555555555" y="298" font-size="11" fill="#59636e" text-anchor="start" font-weight="normal">엣지의 53%</text><text x="20" y="340" font-size="11" fill="#59636e" text-anchor="start" font-weight="normal">사건 추출이 기사당 약 2.9건을 내고, 같은 사건 통합이 그 절반 가까이를 합친다. 통합 단계가 그래프 크기를 정하는 큰 요인이다</text><text x="20" y="358" font-size="11" fill="#59636e" text-anchor="start" font-weight="normal">발표의 12개월 270만 엣지 추정은 월 2만 건 유입의 선형 비례이고, 병합률이 오르면 그보다 적을 수 있다고 슬라이드 각주가 밝힌다</text><text x="20" y="376" font-size="11" fill="#59636e" text-anchor="start" font-weight="normal">2026-01~04 원시 113,704건은 백필 예정분으로 위 값에 들어 있지 않다</text><text x="672" y="394" font-size="9" fill="#8b949e" text-anchor="end">생성: python scripts/figures/kpaykg_figures.py · 손으로 고치지 말 것</text></svg>